<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가락온 (GarakOn) - 상상을 가락으로</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- VexFlow 라이브러리 (오선보 렌더링용) -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .grid-cell {
      transition: background-color 0.1s ease;
      touch-action: manipulation;
    }
    /* 음표 클릭/생성 시 자석처럼 탁 붙는 스냅 애니메이션 */
    @keyframes snapIn {
      0% {
        transform: scale(0.85);
        opacity: 0.6;
      }
      60% {
        transform: scale(1.04);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    .snap-note {
      animation: snapIn 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
    }
    /* 스크롤바 생겨도 상단 헤더와 그리드 칸 위치가 일치하도록 설정 */
    .has-stable-gutter {
      scrollbar-gutter: stable;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-3 py-2 shadow-2xs">
    <div class="max-w-full mx-auto flex items-center justify-between gap-2">
      
      <!-- Brand & Title & Mobile Settings Toggle -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-base sm:text-xl font-black shadow-sm shrink-0">
          <i class="fa-solid fa-music"></i>
        </div>
        <!-- 헤더 문구 -->
        <div class="flex flex-col justify-center">
          <h1 class="text-base sm:text-xl font-black text-slate-900 tracking-tight leading-none whitespace-nowrap">
            가락온 <span class="text-xs font-normal text-slate-500 hidden sm:inline">(GarakOn)</span>
          </h1>
          <p class="text-xs sm:text-sm font-extrabold text-slate-700 whitespace-nowrap leading-tight mt-0.5">
            상상을 가락으로
          </p>
          <p class="text-[9px] sm:text-[11px] text-slate-500 font-medium whitespace-nowrap leading-tight mt-0.5">
            나만의 음악을 만들고, 기록하고, 표현하다.
          </p>
        </div>

        <!-- Mobile Toggle Settings Button (하늘색) -->
        <button id="mobileSettingsToggleBtn" class="lg:hidden flex items-center justify-center p-2 bg-sky-100 hover:bg-sky-200 active:bg-sky-300 text-sky-700 border border-sky-200 rounded-xl transition-all cursor-pointer touch-manipulation ml-1 shadow-2xs shrink-0">
          <i class="fa-solid fa-sliders text-sm"></i>
        </button>
      </div>

      <!-- Quick Action Controls Container -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink min-w-0">
        
        <!-- 1. 가로 스크롤 가능한 일반 버튼 그룹 (재생/정지/반복/삭제/악보) -->
        <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar py-1 shrink min-w-0">
          <!-- Play / Stop -->
          <button id="playBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-4 sm:py-2.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-sm transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0">
            <i class="fa-solid fa-play text-xs"></i>
          </button>
          <button id="stopBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-4 sm:py-2.5 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0">
            <i class="fa-solid fa-square text-xs"></i>
          </button>

          <!-- Loop Mode Toggle Button (아이콘 전용) -->
          <button id="loopToggleBtn" class="flex items-center justify-center p-2.5 sm:px-3.5 sm:py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-slate-200 shrink-0" title="반복 재생 설정">
            <i id="loopIcon" class="fa-solid fa-rotate-right text-slate-500 text-xs sm:text-sm"></i>
          </button>

          <button id="clearBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-3 sm:py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>

          <!-- 오선보 보기 버튼 (아이콘 전용) -->
          <button id="sheetMusicBtn" class="flex items-center justify-center px-2.5 py-2 sm:px-3 sm:py-2.5 bg-purple-100 hover:bg-purple-200 text-purple-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-purple-200 shrink-0" title="Sheet Music">
            <i class="fa-solid fa-file-audio text-purple-600"></i>
          </button>
        </div>

        <!-- 2. 드롭다운 메뉴 영역 (스크롤에 구애받지 않도록 고정 분리) -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Sample Songs Dropdown (아이콘 전용) -->
          <div class="relative shrink-0 z-50">
            <button id="sampleBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-3 sm:py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation" title="예시곡 목록">
              <i class="fa-solid fa-music text-amber-600"></i> <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
            <div id="sampleMenu" class="hidden absolute right-0 top-full mt-1 w-44 sm:w-48 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
              <button data-song="airplane" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 active:bg-amber-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                ✈️ 비행기 <span class="text-[10px] text-slate-400">4/4박자</span>
              </button>
              <button data-song="butterfly" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 active:bg-amber-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                🦋 나비야 <span class="text-[10px] text-slate-400">2/4박자</span>
              </button>
              <button data-song="schoolbell" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 active:bg-amber-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                🔔 학교종 <span class="text-[10px] text-slate-400">4/4박자</span>
              </button>
              <button data-song="arirang" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 active:bg-amber-100 text-xs sm:text-sm font-medium text-slate-700 flex items-center justify-between cursor-pointer">
                🌾 아리랑 <span class="text-[10px] text-slate-400">3/4박자</span>
              </button>
            </div>
          </div>

          <!-- Save & Export Dropdown (아이콘 전용) -->
          <div class="relative shrink-0 z-50">
            <button id="exportBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-3 sm:py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation" title="저장 및 내보내기">
              <i class="fa-solid fa-download text-indigo-600"></i> <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
            <div id="exportMenu" class="hidden absolute right-0 top-full mt-1 w-48 sm:w-56 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
              <button id="exportWav" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 active:bg-indigo-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-file-audio text-indigo-500 w-4"></i> 오디오 (.wav)
              </button>
              <button id="exportMidi" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 active:bg-indigo-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-file-lines text-emerald-500 w-4"></i> 미디 (.mid)
              </button>
              <button id="saveJson" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 active:bg-indigo-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-floppy-disk text-amber-500 w-4"></i> 백업 (.garakon)
              </button>
              <button id="loadJson" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 active:bg-indigo-100 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-folder-open text-blue-500 w-4"></i> 불러오기
              </button>
              <button id="shareUrl" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 active:bg-indigo-100 text-xs sm:text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-link text-purple-500 w-4"></i> 공유 링크 복사
              </button>
            </div>
          </div>
        </div>

        <input type="file" id="jsonInput" class="hidden" accept=".garakon,.json">
      </div>
    </div>
  </header>

  <!-- Controls Toolbar -->
  <section id="controlsToolbar" class="bg-white border-b border-slate-200 px-3 py-2 shadow-2xs hidden lg:block transition-all">
    <div class="max-w-full mx-auto flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5">
      
      <!-- Left: Note Durations Brush Picker -->
      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
        <div class="flex items-center bg-slate-100 p-1 rounded-xl gap-1 shrink-0" id="durationPicker">
          <span class="text-[11px] sm:text-xs font-bold text-slate-500 px-1.5">음길이:</span>
          
          <button data-dur="0.25" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♬ 16분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8,8 L8,1 A7,7 0 0,1 15,8 Z" />
              </svg>
            </div>
          </button>

          <button data-dur="0.5" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♪ 8분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8,8 L8,1 A7,7 0 0,1 8,15 Z" />
              </svg>
            </div>
          </button>

          <button data-dur="1" class="dur-btn active-dur px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow-2xs cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩ 4분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-300" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
            </div>
          </button>

          <button data-dur="1.5" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩. 점4분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8,8 L8,1 A7,7 0 0,1 8,15 Z" />
              </svg>
            </div>
          </button>

          <button data-dur="2" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>𝅗𝅥 2분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
            </div>
          </button>

          <button data-dur="3" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩. 점2분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
            </div>
          </button>

          <button data-dur="4" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>𝅝 온음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="7" />
              </svg>
            </div>
          </button>
        </div>
      </div>

      <!-- Right: Settings & Instruments Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap text-xs">
        
        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">악기:</span>
          <select id="instSelect" class="bg-transparent text-slate-800 font-bold text-xs focus:outline-none cursor-pointer">
            <option value="piano">🎹 피아노</option>
            <option value="strings">🎻 현악기</option>
            <option value="woodwind">🎷 관악기</option>
            <option value="marimba">🪵 마림바</option>
            <option value="kalimba">📻 칼림바</option>
            <option value="synth">𝎛️ 신디사이저</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">음계:</span>
          <select id="scaleSelect" class="bg-transparent text-slate-800 font-bold text-xs focus:outline-none cursor-pointer">
            <option value="diatonic">7음계 (도레미파솔라시)</option>
            <option value="pentatonic">5음계 (도레미솔라)</option>
            <option value="chromatic">12음계 (반음 포함)</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">옥타브:</span>
          <select id="octaveSelect" class="bg-transparent text-slate-800 font-bold text-xs focus:outline-none cursor-pointer">
            <option value="1">1옥타브 (C4~B4)</option>
            <option value="2">2옥타브 (C4~B5)</option>
            <option value="3">3옥타브 (C3~B5)</option>
            <option value="4">4옥타브 (C2~B5)</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">박자:</span>
          <select id="timeSigSelect" class="bg-transparent text-slate-800 font-bold text-xs focus:outline-none cursor-pointer">
            <option value="4/4">4/4 박자</option>
            <option value="2/4">2/4 박자</option>
            <option value="3/4">3/4 박자</option>
            <option value="6/8">6/8 박자</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">마디:</span>
          <select id="measuresSelect" class="bg-transparent text-slate-800 font-bold text-xs focus:outline-none cursor-pointer">
            <option value="2">2마디</option>
            <option value="4" selected>4마디</option>
            <option value="8">8마디</option>
            <option value="12">12마디</option>
            <option value="16">16마디</option>
          </select>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1.5 rounded-xl border border-slate-200">
          <span class="font-bold text-slate-500 text-[11px]">속도:</span>
          <input type="range" id="bpmRange" min="50" max="200" value="120" class="w-14 sm:w-16 accent-emerald-600 cursor-pointer">
          <span id="bpmVal" class="font-extrabold text-slate-800 text-xs w-6">120</span>
        </div>

      </div>
    </div>
  </section>

  <!-- Main Grid Area -->
  <main class="flex-1 w-full p-2 sm:p-4 flex flex-col justify-center overflow-hidden">
    <div id="gridContainer" class="w-full bg-white rounded-xl sm:rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col max-h-[80vh]">
      
      <div class="w-full overflow-x-auto smooth-scroll flex flex-col flex-1">
        
        <div class="flex w-full min-w-[650px] sm:min-w-[850px] bg-slate-100 border-b border-slate-200">
          <div class="w-16 sm:w-24 shrink-0"></div>
          <div id="stepsHeader" class="flex flex-1 text-xs font-bold text-slate-500 py-1">
            <!-- Rendered dynamically -->
          </div>
          <div id="headerScrollSpacer" class="w-0 shrink-0"></div>
        </div>

        <div id="gridScrollArea" class="flex flex-col w-full overflow-y-auto has-stable-gutter smooth-scroll min-w-[650px] sm:min-w-[850px]">
          <div id="scoreGrid" class="flex flex-col w-full divide-y divide-slate-100">
            <!-- Rendered dynamically -->
          </div>

          <div id="percGrid" class="flex flex-col w-full divide-y divide-amber-100 bg-amber-50/20 border-t border-slate-200">
            <!-- Rendered dynamically -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer Banner -->
  <footer class="bg-slate-100 text-slate-500 py-2.5 px-4 text-center border-t border-slate-200 shrink-0">
    <div class="flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-graduation-cap text-slate-400 text-xs"></i>
      <span class="font-medium text-xs tracking-wide">서울교대 박현진 스튜디오</span>
      <span class="text-[10px] text-slate-400 ml-0.5">| GarakOn Music Lab</span>
    </div>
  </footer>

  <!-- Toast Notification Box -->
