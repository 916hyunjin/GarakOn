<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가락온 (GarakOn) - 상상을 가락으로</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- VexFlow 라이브러리 (오선보 렌더링용) -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .grid-cell {
      transition: background-color 0.1s ease;
      touch-action: manipulation;
    }
    @keyframes snapIn {
      0% { transform: scale(0.85); opacity: 0.6; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .snap-note {
      animation: snapIn 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .smooth-scroll { -webkit-overflow-scrolling: touch; }
    .has-stable-gutter { scrollbar-gutter: stable; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-3 py-2 shadow-2xs">
    <div class="max-w-full mx-auto flex items-center justify-between gap-2">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl overflow-hidden shadow-sm shrink-0 bg-emerald-600 flex items-center justify-center">
          <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="20" fill="#059669"/>
            <path d="M20 70C20 64.4772 24.4772 60 30 60H35C40.5228 60 45 55.5228 45 50V45C45 39.4772 49.4772 35 55 35H60C65.5228 35 70 30.5228 70 25V20C70 14.4772 74.4772 10 80 10" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
            <circle cx="25" cy="35" r="5" fill="#38BDF8"/>
            <circle cx="40" cy="25" r="5" fill="#F43F5E"/>
            <circle cx="55" cy="18" r="5" fill="#A855F7"/>
            <rect x="50" y="65" width="16" height="25" rx="8" fill="#38BDF8"/>
            <rect x="70" y="55" width="16" height="35" rx="8" fill="#C084FC"/>
            <rect x="20" y="60" width="25" height="25" rx="8" fill="#34D399"/>
          </svg>
        </div>
        <div class="flex flex-col justify-center">
          <h1 class="text-xs sm:text-xl font-black text-emerald-800 tracking-tight leading-none whitespace-nowrap">
            가락온 GarakOn
          </h1>
          <p class="text-[10px] sm:text-sm font-extrabold text-slate-700 whitespace-nowrap leading-tight mt-0.5">
            상상을 가락으로
          </p>
        </div>
      </div>

      <!-- Controls Right Group -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink min-w-0 justify-end">
        <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar py-0.5 shrink min-w-0">
          <button id="playBtn" class="flex items-center gap-1 px-3 py-2 sm:px-4 sm:py-2.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-sm transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0">
            <i class="fa-solid fa-play text-xs"></i>
          </button>
          <button id="stopBtn" class="flex items-center gap-1 px-2.5 py-2 sm:px-3 sm:py-2.5 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0">
            <i class="fa-solid fa-square text-xs"></i>
          </button>

          <!-- Loop Mode Toggle Button -->
          <button id="loopToggleBtn" class="flex items-center justify-center p-2 sm:px-3.5 sm:py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-slate-200 shrink-0" title="반복 재생 설정">
            <i id="loopIcon" class="fa-solid fa-arrows-rotate text-slate-500 text-xs sm:text-sm"></i>
          </button>

          <!-- Undo / Redo Buttons -->
          <button id="undoBtn" class="flex items-center justify-center p-2 sm:px-3 sm:py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-slate-200 shrink-0" title="실행 취소 (Ctrl+Z)">
            <i class="fa-solid fa-rotate-left text-slate-600 text-xs"></i>
          </button>
          <button id="redoBtn" class="flex items-center justify-center p-2 sm:px-3 sm:py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-slate-200 shrink-0" title="다시 실행 (Ctrl+Y)">
            <i class="fa-solid fa-arrow-rotate-right text-slate-600 text-xs"></i>
          </button>

          <button id="clearBtn" class="flex items-center gap-1 p-2 sm:px-3 sm:py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation shrink-0" title="전체 삭제">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>

          <button id="sheetMusicBtn" class="flex items-center justify-center p-2 sm:px-3 sm:py-2.5 bg-purple-100 hover:bg-purple-200 text-purple-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation border border-purple-200 shrink-0" title="Sheet Music">
            <i class="fa-solid fa-file-audio text-purple-600 text-xs"></i>
          </button>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <button id="mobileSettingsToggleBtn" class="lg:hidden flex items-center justify-center p-2 bg-sky-100 hover:bg-sky-200 active:bg-sky-300 text-sky-700 border border-sky-200 rounded-xl transition-all cursor-pointer touch-manipulation shadow-2xs shrink-0" title="설정 열기">
            <i class="fa-solid fa-sliders text-xs"></i>
          </button>

          <!-- Sample Songs Dropdown -->
          <div class="relative shrink-0 z-50">
            <button id="sampleBtn" class="flex items-center gap-1 p-2 sm:px-3 sm:py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation" title="예시곡 목록">
              <i class="fa-solid fa-music text-amber-600 text-xs"></i> <i class="fa-solid fa-chevron-down text-[9px]"></i>
            </button>
            <div id="sampleMenu" class="hidden absolute right-0 top-full mt-1 w-48 sm:w-52 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
              <button data-song="airplane" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                ✈️ 비행기 <span class="text-[10px] text-slate-400">4/4박자</span>
              </button>
              <button data-song="butterfly" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                🦋 나비야 <span class="text-[10px] text-slate-400">2/4박자</span>
              </button>
              <button data-song="schoolbell" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                🔔 학교종 <span class="text-[10px] text-slate-400">4/4박자</span>
              </button>
              <button data-song="arirang" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center justify-between cursor-pointer">
                🌾 아리랑 <span class="text-[10px] text-slate-400">3/4박자</span>
              </button>
              <button data-song="puff" class="w-full text-left px-3 py-2.5 hover:bg-amber-50 text-xs sm:text-sm font-medium text-slate-700 flex items-center justify-between cursor-pointer">
                🐉 퍼프와 재키 <span class="text-[10px] text-slate-400">4/4박자</span>
              </button>
            </div>
          </div>

          <!-- Save & Export Dropdown -->
          <div class="relative shrink-0 z-50">
            <button id="exportBtn" class="flex items-center gap-1 p-2 sm:px-3 sm:py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-bold rounded-xl transition-all text-xs sm:text-sm cursor-pointer touch-manipulation" title="저장 및 내보내기">
              <i class="fa-solid fa-download text-indigo-600 text-xs"></i> <i class="fa-solid fa-chevron-down text-[9px]"></i>
            </button>
            <div id="exportMenu" class="hidden absolute right-0 top-full mt-1 w-48 sm:w-56 bg-white border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
              <button id="exportWav" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-file-audio text-indigo-500 w-4"></i> 오디오 (.wav)
              </button>
              <button id="exportMidi" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-file-lines text-emerald-500 w-4"></i> 미디 (.mid)
              </button>
              <button id="saveJson" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-floppy-disk text-amber-500 w-4"></i> 백업 (.garakon)
              </button>
              <button id="loadJson" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 text-xs sm:text-sm font-medium text-slate-700 border-b border-slate-100 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-folder-open text-blue-500 w-4"></i> 불러오기
              </button>
              <button id="shareUrl" class="w-full text-left px-3 py-2.5 hover:bg-indigo-50 text-xs sm:text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-link text-purple-500 w-4"></i> 공유 링크 복사
              </button>
            </div>
          </div>
        </div>

        <input type="file" id="jsonInput" class="hidden" accept=".garakon,.json">
      </div>

    </div>
  </header>

  <!-- Mobile Collapsible Settings Bar (모바일 전용 설정바) -->
  <section id="mobileSettingsBar" class="bg-sky-50 border-b border-sky-200 px-3 py-2 shadow-inner lg:hidden hidden">
    <div class="flex flex-col gap-2 text-xs">
      <!-- 음길이 선택 (풀네임 적용) -->
      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
        <span class="text-[11px] font-bold text-sky-800 shrink-0">음길이:</span>
        <div class="flex items-center bg-white p-1 rounded-xl gap-1 shrink-0 durationPickerContainer border border-sky-200 overflow-x-auto no-scrollbar">
          <button data-dur="0.25" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">♬ 16분음표</button>
          <button data-dur="0.5" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">♪ 8분음표</button>
          <button data-dur="1" class="dur-btn active-dur px-2 py-1 rounded-lg text-[10px] font-bold bg-emerald-600 text-white whitespace-nowrap">♩ 4분음표</button>
          <button data-dur="1.5" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">♩. 점 4분음표</button>
          <button data-dur="2" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">𝅗𝅥 2분음표</button>
          <button data-dur="3" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">♩. 점 2분음표</button>
          <button data-dur="4" class="dur-btn px-2 py-1 rounded-lg text-[10px] font-bold text-slate-600 whitespace-nowrap">𝅝 온음표</button>
        </div>
      </div>

      <!-- 드롭다운 설정 옵션들 -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">악기:</span>
          <select class="instSelect bg-transparent text-slate-800 font-bold text-[11px] focus:outline-none">
            <option value="piano">🎹 피아노</option>
            <option value="strings">🎻 현악기</option>
            <option value="woodwind">🎷 관악기</option>
            <option value="marimba">🪵 마림바</option>
            <option value="kalimba">📻 칼림바</option>
            <option value="synth">𝎛️ 신디사이저</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">음계:</span>
          <select class="scaleSelect bg-transparent text-slate-800 font-bold text-[11px] focus:outline-none">
            <option value="diatonic">7음계 (도레미파솔라시)</option>
            <option value="pentatonic">5음계 (도레미솔라)</option>
            <option value="chromatic">12음계 (반음 포함)</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">옥타브:</span>
          <select class="octaveSelect bg-transparent text-slate-800 font-bold text-[11px] focus:outline-none">
            <option value="1">1옥타브 (C4~B4)</option>
            <option value="2">2옥타브 (C4~B5)</option>
            <option value="3">3옥타브 (C3~B5)</option>
            <option value="4">4옥타브 (C2~B5)</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">박자:</span>
          <select class="timeSigSelect bg-transparent text-slate-800 font-bold text-[11px] focus:outline-none">
            <option value="4/4">4/4 박자</option>
            <option value="2/4">2/4 박자</option>
            <option value="3/4">3/4 박자</option>
            <option value="6/8">6/8 박자</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">마디:</span>
          <select class="measuresSelect bg-transparent text-slate-800 font-bold text-[11px] focus:outline-none">
            <option value="2">2마디</option>
            <option value="4" selected>4마디</option>
            <option value="8">8마디</option>
            <option value="12">12마디</option>
            <option value="16">16마디</option>
          </select>
        </div>

        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-sky-200 shrink-0">
          <span class="font-bold text-slate-500 text-[10px]">속도:</span>
          <input type="range" class="bpmRange w-12 accent-emerald-600 cursor-pointer" min="50" max="200" value="120">
          <span class="bpmVal font-extrabold text-slate-800 text-[11px] w-5">120</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Controls Toolbar (PC & Tablet 전용, 풀네임 적용) -->
  <section id="controlsToolbar" class="bg-white border-b border-slate-200 px-3 py-2 shadow-2xs hidden lg:block transition-all">
    <div class="max-w-full mx-auto flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5">
      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
        <div class="flex items-center bg-slate-100 p-1 rounded-xl gap-1 shrink-0 durationPickerContainer">
          <span class="text-[11px] sm:text-xs font-bold text-slate-500 px-1.5">음길이:</span>
          
          <button data-dur="0.25" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♬ 16분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8,8 L8,1 A7,7 0 0,1 15,8 Z" /></svg>
            </div>
          </button>

          <button data-dur="0.5" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♪ 8분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8,8 L8,1 A7,7 0 0,1 8,15 Z" /></svg>
            </div>
          </button>

          <button data-dur="1" class="dur-btn active-dur px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow-2xs cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩ 4분음표</span>
            <div class="flex items-center justify-center mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-300" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
            </div>
          </button>

          <button data-dur="1.5" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩. 점 4분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8,8 L8,1 A7,7 0 0,1 8,15 Z" /></svg>
            </div>
          </button>

          <button data-dur="2" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>𝅗𝅥 2분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
            </div>
          </button>

          <button data-dur="3" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>♩. 점 2분음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
            </div>
          </button>

          <button data-dur="4" class="dur-btn px-2 sm:px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 cursor-pointer touch-manipulation flex flex-col items-center leading-tight">
            <span>𝅝 온음표</span>
            <div class="flex items-center justify-center gap-0.5 mt-1">
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
              <svg class="w-3.5 h-3.5 fill-current text-amber-600" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
            </div>
          </button>
        </div>

    function updateUrlHash() {
      try {
        const stateObj = { timeSig: currentTimeSig, measures: currentMeasures, bpm: bpm, scale: currentScale, octaves: currentOctaves, inst: currentInstrument, gridData: gridData };
        window.history.replaceState(null, '', window.location.origin + window.location.pathname + '#data=' + encodeURIComponent(JSON.stringify(stateObj)));
      } catch (e) {}
    }

    function syncSelectControls(selector, value) {
      document.querySelectorAll(selector).forEach(el => { el.value = value; });
    }

    function loadStateFromUrl() {
      if (!window.location.hash || !window.location.hash.startsWith('#data=')) return false;
      try {
        const loaded = JSON.parse(decodeURIComponent(window.location.hash.substring(6)));
        if (loaded && loaded.gridData) {
          gridData = loaded.gridData;
          if (loaded.timeSig) currentTimeSig = loaded.timeSig;
          if (loaded.measures) currentMeasures = loaded.measures;
          if (loaded.bpm) bpm = loaded.bpm;
          if (loaded.scale) currentScale = loaded.scale;
          if (loaded.octaves) currentOctaves = loaded.octaves;
          if (loaded.inst) currentInstrument = loaded.inst;

          syncSelectControls('.timeSigSelect', currentTimeSig);
          syncSelectControls('.measuresSelect', currentMeasures);
          syncSelectControls('.scaleSelect', currentScale);
          syncSelectControls('.octaveSelect', currentOctaves);
          syncSelectControls('.instSelect', currentInstrument);
          document.querySelectorAll('.bpmRange').forEach(el => el.value = bpm);
          document.querySelectorAll('.bpmVal').forEach(el => el.innerText = bpm);
          return true;
        }
      } catch (e) {}
      return false;
    }

    function playNote(pitch, duration = 0.5, customCtx = null, startTime = 0) {
      const ctx = customCtx || getAudioContext();
      const freq = pitchFrequencies[pitch];
      if (!freq) return;
      const now = customCtx ? startTime : ctx.currentTime;

      if (currentInstrument === 'piano') {
        const oscFund = ctx.createOscillator();   
        const oscTri = ctx.createOscillator();    
        const oscHammer = ctx.createOscillator(); 
        const gainFund = ctx.createGain();
        const gainTri = ctx.createGain();
        const gainHammer = ctx.createGain();

        oscFund.type = 'sine'; oscFund.frequency.setValueAtTime(freq, now);
        oscTri.type = 'triangle'; oscTri.frequency.setValueAtTime(freq * 2, now);
        oscHammer.type = 'square'; oscHammer.frequency.setValueAtTime(freq * 4, now);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 3.5, now);
        filter.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 1.5), now + duration * 1.5);

        gainFund.gain.setValueAtTime(0.7, now); gainFund.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(1.2, duration * 2.0));
        gainTri.gain.setValueAtTime(0.25, now); gainTri.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.8, duration * 1.5));
        gainHammer.gain.setValueAtTime(0.12, now); gainHammer.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

        oscFund.connect(gainFund); oscTri.connect(gainTri); oscHammer.connect(gainHammer);
        gainFund.connect(filter); gainTri.connect(filter); gainHammer.connect(filter);
        filter.connect(ctx.destination);

        oscFund.start(now); oscTri.start(now); oscHammer.start(now);
        oscFund.stop(now + Math.max(1.2, duration * 2.0)); oscTri.stop(now + Math.max(0.8, duration * 1.5)); oscHammer.stop(now + 0.04);
        return;
      } 
      
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (currentInstrument === 'strings') {
        const numOscs = 4;
        const detunes = [-7, -2.5, 3, 7.5]; 
        const masterGain = ctx.createGain();
        const lfo = ctx.createOscillator();
        lfo.frequency.setValueAtTime(5.5, now); 

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 2.2, now);

        for (let i = 0; i < numOscs; i++) {
          const oscEns = ctx.createOscillator();
          oscEns.type = (i % 2 === 0) ? 'sawtooth' : 'triangle'; 
          oscEns.frequency.setValueAtTime(freq, now);
          oscEns.detune.setValueAtTime(detunes[i], now);
          lfo.connect(oscEns.frequency);
          oscEns.connect(filter);
          oscEns.start(now); oscEns.stop(now + duration * 1.6);
        }

        lfo.start(now); lfo.stop(now + duration * 1.6);
        masterGain.gain.setValueAtTime(0.001, now);
        masterGain.gain.linearRampToValueAtTime(0.28, now + 0.12);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 1.6);
        filter.connect(masterGain); masterGain.connect(ctx.destination);
        return;
      } else if (currentInstrument === 'woodwind') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.01, now); gain.gain.linearRampToValueAtTime(0.5, now + 0.08); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      } else if (currentInstrument === 'marimba') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      } else if (currentInstrument === 'kalimba') {
        const oscMain = ctx.createOscillator(); const oscHighBell = ctx.createOscillator();
        const gainMain = ctx.createGain(); const gainHighBell = ctx.createGain();
        oscMain.type = 'sine'; oscMain.frequency.setValueAtTime(freq, now);
        oscHighBell.type = 'sine'; oscHighBell.frequency.setValueAtTime(freq * 4.0, now);
        gainMain.gain.setValueAtTime(0.5, now); gainMain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(1.2, duration * 2.2));
        gainHighBell.gain.setValueAtTime(0.35, now); gainHighBell.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        oscMain.connect(gainMain); oscHighBell.connect(gainHighBell);
        gainMain.connect(ctx.destination); gainHighBell.connect(ctx.destination);
        oscMain.start(now); oscHighBell.start(now);
        oscMain.stop(now + Math.max(1.2, duration * 2.2)); oscHighBell.stop(now + 0.4);
        return;
      } else {
        osc.type = 'square'; osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      }

      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + duration * 1.5);
    }

    function playPercussion(type, customCtx = null, startTime = 0) {
      const ctx = customCtx || getAudioContext();
      const now = customCtx ? startTime : ctx.currentTime;
      const trackObj = percTracks.find(p => p.id === type);
      const instrument = trackObj ? trackObj.selected : '';

      if (instrument === '클로즈드 하이햇' || instrument === '오픈 하이햇') {
        const isClosed = (instrument === '클로즈드 하이햇');
        const dur = isClosed ? 0.04 : 0.22;
        const bufferSize = Math.floor(ctx.sampleRate * dur);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(8000, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        noise.start(now);
      } else if (instrument === '스네어 드럼') {
        const toneOsc = ctx.createOscillator();
        const toneGain = ctx.createGain();
        toneOsc.type = 'triangle';
        toneOsc.frequency.setValueAtTime(180, now);
        toneOsc.frequency.exponentialRampToValueAtTime(80, now + 0.05);

        toneGain.gain.setValueAtTime(0.7, now);
        toneGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        toneOsc.connect(toneGain);
        toneGain.connect(ctx.destination);
        toneOsc.start(now); toneOsc.stop(now + 0.05);

        const dur = 0.06;
        const bufferSize = Math.floor(ctx.sampleRate * dur);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noiseSrc = ctx.createBufferSource();
        noiseSrc.buffer = buffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.setValueAtTime(1500, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.65, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noiseSrc.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noiseSrc.start(now);
      } else if (instrument === '미들탐') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.12);

        gain.gain.setValueAtTime(0.85, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.12);
      } else if (instrument === '트라이앵글' || instrument === '꽹과리') {
        const isGgwaeng = (instrument === '꽹과리');
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine'; osc2.type = 'triangle';
        if (isGgwaeng) {
          osc1.frequency.setValueAtTime(2800, now);
          osc2.frequency.setValueAtTime(3900, now);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        } else {
          osc1.frequency.setValueAtTime(4500, now);
          osc2.frequency.setValueAtTime(5200, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        }

        osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
        osc1.start(now); osc2.start(now);
        osc1.stop(now + 0.4); osc2.stop(now + 0.4);
      } else if (instrument === '소고' || instrument === '우드블럭') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime((instrument === '소고') ? 850 : 1200, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.04);
      } else if (instrument === '장구 채편') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.06);
        gain.gain.setValueAtTime(0.75, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.06);
      } else if (instrument === '징') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.linearRampToValueAtTime(170, now + 1.0);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 1.1);
      } else if (instrument === '베이스 드럼') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.05);

        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } else if (instrument === '로우탐') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.15);

        gain.gain.setValueAtTime(0.85, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.15);
      } else if (instrument === '베이스 카혼') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);

        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if (instrument === '북') {
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.18);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, now);

        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.18);
      } else if (instrument === '장구 궁편') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);

        gain.gain.setValueAtTime(0.8, now);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.14);
      }

    function renderGrid() {
      const stepsHeader = document.getElementById('stepsHeader');
      const scoreGrid = document.getElementById('scoreGrid');
      const percGrid = document.getElementById('percGrid');
      if (!stepsHeader || !scoreGrid || !percGrid) return;

      stepsHeader.innerHTML = ''; scoreGrid.innerHTML = ''; percGrid.innerHTML = '';

      const totalQuarterBeats = getTotalSteps();
      const beatsPerMeasure = getBeatsPerMeasure();

      for (let s = 0; s < totalQuarterBeats; s++) {
        const stepBox = document.createElement('div');
        const isMeasureStart = s % beatsPerMeasure === 0;
        let borderClass = isMeasureStart ? 'border-l-2 border-l-slate-300 border-r border-slate-200' : 'border-r border-slate-200';
        stepBox.className = `flex-1 h-9 sm:h-10 flex items-center justify-center text-xs font-bold ${borderClass} ${isMeasureStart ? 'bg-slate-200 text-slate-800 font-black' : 'bg-slate-100 text-slate-500'}`;
        stepBox.innerText = isMeasureStart ? `${Math.floor(s / beatsPerMeasure) + 1}마디` : '';
        stepBox.id = `step-head-${s}`;
        stepsHeader.appendChild(stepBox);
      }

      const activeNotes = getActiveNoteList();
      const rowHeightClass = getNoteRowHeightClass();

      activeNotes.forEach((n) => {
        const row = document.createElement('div');
        row.className = 'flex items-center w-full';

        const label = document.createElement('div');
        label.className = `w-16 sm:w-24 shrink-0 ${rowHeightClass} px-1.5 py-0.5 sm:px-2 sm:py-1 text-[10px] sm:text-xs font-black shadow-2xs ${n.color} flex items-center justify-between border-b border-slate-200 overflow-hidden`;
        label.innerText = n.label;
        row.appendChild(label);

        const cellsContainer = document.createElement('div');
        cellsContainer.className = 'flex flex-1 w-full relative';
        const rowKey = n.name;
        if (!gridData[rowKey]) gridData[rowKey] = {};

        for (let s = 0; s < totalQuarterBeats; s++) {
          const isMeasureStart = s % beatsPerMeasure === 0;
          let borderClass = isMeasureStart ? 'border-l-2 border-l-slate-300 border-r border-slate-200' : 'border-r border-slate-200';

          const cell = document.createElement('div');
          cell.className = `grid-cell flex-1 ${rowHeightClass} border-b border-slate-200/80 relative cursor-pointer ${borderClass} ${isMeasureStart ? 'bg-slate-100/70 hover:bg-slate-200/50' : 'bg-white hover:bg-slate-50'}`;
          cell.id = `cell-${rowKey}-${s}`;

          Object.keys(gridData[rowKey]).forEach((subKey) => {
            const subStep = parseFloat(subKey);
            if (subStep >= s && subStep < s + 1) {
              const noteData = gridData[rowKey][subKey];
              const noteBlock = document.createElement('div');
              noteBlock.className = `snap-note absolute top-0 h-full ${n.noteColor} shadow-sm rounded-md border border-white/60 flex items-center justify-end z-10 select-none overflow-hidden`;
              noteBlock.style.left = `${(subStep - s) * 100}%`;
              noteBlock.style.width = `${(noteData.duration || 1) * 100}%`;

              const handle = document.createElement('div');
              handle.className = 'w-4 h-full cursor-ew-resize hover:bg-black/10 active:bg-black/20 flex items-center justify-center shrink-0 text-[10px] font-bold opacity-70 z-20';
              handle.innerText = '⋮';
              
              const startResize = (clientX) => {
                saveStateForUndo();
                let nextKeyStep = getTotalSteps();
                Object.keys(gridData[rowKey]).forEach(k => {
                  const kStep = parseFloat(k);
                  if (kStep > subStep && kStep < nextKeyStep) nextKeyStep = kStep;
                });
                activeResizeState = {
                  rowKey: rowKey, startStep: subStep, startDur: noteData.duration || 1, startClientX: clientX,
                  cellWidthPx: cell.getBoundingClientRect().width, maxDuration: nextKeyStep - subStep, targetElem: noteBlock
                };
              };

              handle.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); startResize(e.clientX); });
              handle.addEventListener('touchstart', (e) => { e.stopPropagation(); if (e.touches.length > 0) startResize(e.touches[0].clientX); }, { passive: false });
              noteBlock.appendChild(handle);
              cell.appendChild(noteBlock);
            }
          });

          cell.addEventListener('click', (e) => {
            if (activeResizeState) return;
            getAudioContext();
            const rect = cell.getBoundingClientRect();
            const fraction = Math.max(0, Math.min(0.99, (e.clientX - rect.left) / rect.width));
            let subOffset = (selectedDuration === 0.25) ? Math.round(fraction * 4) * 0.25 : ((selectedDuration === 0.5) ? Math.round(fraction * 2) * 0.5 : 0);
            const targetStep = s + Math.min(0.75, subOffset);

            let existingKeyToToggle = null;
            Object.keys(gridData[rowKey]).forEach((existKey) => {
              const existStep = parseFloat(existKey);
              const existDur = (gridData[rowKey][existKey] && gridData[rowKey][existKey].duration) ? gridData[rowKey][existKey].duration : 1;
              if (targetStep >= existStep && targetStep < existStep + existDur - 0.001) existingKeyToToggle = existKey;
            });

            saveStateForUndo();
            if (existingKeyToToggle !== null) {
              delete gridData[rowKey][existingKeyToToggle];
            } else {
              gridData[rowKey][targetStep] = { duration: selectedDuration };
              playNote(rowKey, selectedDuration * (60 / bpm));
            }
            renderGrid();
          });

          cellsContainer.appendChild(cell);
        }
        row.appendChild(cellsContainer);
        scoreGrid.appendChild(row);
      });

      const totalSubBeats8th = totalQuarterBeats * 2;
      percTracks.forEach((pTrack) => {
        const row = document.createElement('div');
        row.className = 'flex items-center w-full';

        const label = document.createElement('div');
        label.className = 'w-16 sm:w-24 shrink-0 h-11 sm:h-14 bg-amber-50 border border-amber-200 border-r-0 px-1 py-1 sm:px-2 sm:py-1.5 text-slate-700 shadow-2xs text-[10px] sm:text-xs font-black flex flex-col items-start justify-center gap-0.5';
        
        const titleSpan = document.createElement('span');

        pTrack.soundOpts.forEach(opt => {

        select.addEventListener('change', (e) => {

        const cellsContainer = document.createElement('div');
        cellsContainer.className = 'flex flex-1 w-full relative';
        const rowKey = `perc_${pTrack.id}`;
        if (!gridData[rowKey]) gridData[rowKey] = {};

        const subBeatsPerMeasure8th = beatsPerMeasure * 2;
        for (let subIdx = 0; subIdx < totalSubBeats8th; subIdx++) {
          const isMeasureStart = subIdx % subBeatsPerMeasure8th === 0;
          const targetStep = subIdx * 0.5;
          let borderClass = isMeasureStart ? 'border-l-2 border-l-slate-300 border-r border-amber-200' : 'border-r border-amber-200/80';

          const cell = document.createElement('div');
          cell.className = `grid-cell flex-1 h-11 sm:h-14 border-t border-b border-amber-200/60 relative cursor-pointer ${borderClass} ${(subIdx % 8 % 2 === 0) ? 'bg-amber-100/60 hover:bg-amber-200/60' : 'bg-amber-50/30 hover:bg-amber-100/40'}`;

    /* 오선보 렌더링 (화음/2중주 표기 지원 - 한 줄에 4마디 배치) */
    function renderSheetMusic() {
      const container = document.getElementById('sheetContainer');
      if (!container) return;
      container.innerHTML = '';
      if (typeof Vex === 'undefined') { container.innerHTML = '<p class="text-rose-500 font-bold py-8">Library Error</p>'; return; }

      const VF = Vex.Flow;
      const beatsPerMeasure = getBeatsPerMeasure();
      const totalMeasures = currentMeasures;

      let measureNotes = Array.from({ length: totalMeasures }, () => []);

      for (let m = 0; m < totalMeasures; m++) {
        const mStart = m * beatsPerMeasure;
        const mEnd = mStart + beatsPerMeasure;

        let timeMap = {};
        Object.keys(gridData).forEach(rowKey => {
          if (rowKey.startsWith('perc_')) return;
          Object.keys(gridData[rowKey]).forEach(stepStr => {
            const step = parseFloat(stepStr);
            if (step >= mStart && step < mEnd) {
              if (!timeMap[step]) timeMap[step] = [];
              timeMap[step].push({
                pitch: rowKey,
                duration: gridData[rowKey][stepStr].duration || 1
              });
            }
          });
        });

        const sortedSteps = Object.keys(timeMap).map(Number).sort((a, b) => a - b);
        let currentPos = mStart;

        sortedSteps.forEach(step => {
          if (step > currentPos) {
            addVexRest(measureNotes[m], step - currentPos, VF);
            currentPos = step;
          }

          const chordNotes = timeMap[step];
          const dur = chordNotes[0].duration;

          addVexChord(measureNotes[m], chordNotes, dur, VF);
          currentPos = step + dur;
        });

        if (currentPos < mEnd) {
          addVexRest(measureNotes[m], mEnd - currentPos, VF);
        }
      }

      const measuresPerLine = 4;
      const numLines = Math.ceil(totalMeasures / measuresPerLine);

      for (let line = 0; line < numLines; line++) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'w-full flex justify-center border-b border-slate-100 pb-2 overflow-x-auto';
        container.appendChild(lineDiv);

        const renderer = new VF.Renderer(lineDiv, VF.Renderer.Backends.SVG);
        renderer.resize(780, 130);
        const context = renderer.getContext();

        for (let i = 0; i < measuresPerLine; i++) {
          const mIdx = line * measuresPerLine + i;
          if (mIdx >= totalMeasures) break;

          const isFirstInLine = (i === 0);
          const stave = new VF.Stave(isFirstInLine ? 10 : 10 + i * 190, 10, isFirstInLine ? 200 : 190);

          if (isFirstInLine) {
            stave.addClef('treble');
            if (mIdx === 0) stave.addTimeSignature(currentTimeSig);
          } else { stave.setBegBarType(VF.Barline.type.NONE); }

          if (mIdx === totalMeasures - 1) stave.setEndBarType(VF.Barline.type.END);
          stave.setContext(context).draw();

          const notes = measureNotes[mIdx];
          if (notes.length > 0) {
            try {
              const voice = new VF.Voice({ num_beats: beatsPerMeasure, beat_value: 4 }).setMode(VF.Voice.Mode.SOFT);
              voice.addTickables(notes);
              new VF.Formatter().joinVoices([voice]).format([voice], isFirstInLine ? 120 : 160);
              voice.draw(context, stave);
            } catch (err) {}
          }
        }
      }
    }

    function addVexChord(arr, chordNotes, durBeats, VF) {
      let keys = [];
      let accidentals = [];

      chordNotes.forEach(n => {
        let octave = parseInt(n.pitch.slice(-1));
        let noteName = n.pitch.slice(0, -1).toLowerCase();
        keys.push(`${noteName}/${octave}`);
        if (n.pitch.includes('#')) accidentals.push(keys.length - 1);
      });

      let vexDur = 'q'; let isDotted = false;
      if (durBeats === 0.25) vexDur = '16';
      else if (durBeats === 0.5) vexDur = '8';
      else if (durBeats === 1) vexDur = 'q';
      else if (durBeats === 1.5) { vexDur = 'q'; isDotted = true; }
      else if (durBeats === 2) vexDur = 'h';
      else if (durBeats === 3) { vexDur = 'h'; isDotted = true; }
      else if (durBeats === 4) vexDur = 'w';

      const noteConfig = { clef: 'treble', keys: keys, duration: vexDur };
      const note = new VF.StaveNote(noteConfig);

      accidentals.forEach(idx => note.addModifier(new VF.Accidental('#'), idx));
      if (isDotted) note.addModifier(new VF.Dot());

      arr.push(note);
    }

    function addVexRest(arr, durBeats, VF) {
      let remaining = durBeats;
      while (remaining > 0) {
        let vexDur = 'q'; let stepDur = 1;
        if (remaining >= 4) { vexDur = 'w'; stepDur = 4; }
        else if (remaining >= 2) { vexDur = 'h'; stepDur = 2; }
        else if (remaining >= 1) { vexDur = 'q'; stepDur = 1; }
        else if (remaining >= 0.5) { vexDur = '8'; stepDur = 0.5; }
        else { vexDur = '16'; stepDur = 0.25; }

        arr.push(new VF.StaveNote({ clef: 'treble', keys: ['b/4'], duration: vexDur + 'r' }));
        remaining -= stepDur;
      }
    }

    function handleGlobalMove(clientX) {
      if (!activeResizeState) return;
      const deltaBeats = (clientX - activeResizeState.startClientX) / activeResizeState.cellWidthPx;
      let newDuration = Math.max(0.25, Math.min(activeResizeState.maxDuration, activeResizeState.startDur + Math.round(deltaBeats * 4) * 0.25));
      activeResizeState.currentDuration = newDuration;
      if (activeResizeState.targetElem) activeResizeState.targetElem.style.width = `${newDuration * 100}%`;
    }

    function handleGlobalEnd() {
      if (activeResizeState) {
        const { rowKey, startStep, currentDuration } = activeResizeState;
        if (currentDuration && gridData[rowKey] && gridData[rowKey][startStep]) gridData[rowKey][startStep].duration = currentDuration;
        activeResizeState = null;
        renderGrid();
      }
    }

    window.addEventListener('mousemove', (e) => handleGlobalMove(e.clientX));
    window.addEventListener('mouseup', handleGlobalEnd);
    window.addEventListener('touchmove', (e) => { if (activeResizeState && e.touches.length > 0) handleGlobalMove(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchend', handleGlobalEnd);

    function startPlayback() {
      if (isPlaying) return;
      getAudioContext();
      isPlaying = true; currentStep = 0;
      const playBtn = document.getElementById('playBtn');
      if (playBtn) { playBtn.classList.replace('bg-emerald-600', 'bg-amber-600'); playBtn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>'; }
      playbackLoop();
    }

    function playbackLoop() {
      if (!isPlaying) return;
      const totalSteps16th = getTotalSteps() * 4;

      if (currentStep >= totalSteps16th) {
        if (isLooping) { currentStep = 0; } else { stopPlayback(); return; }
      }

      playStep16th(currentStep);
      currentStep++;
      playTimeout = setTimeout(playbackLoop, ((60 / bpm) / 4) * 1000);
    }

    function stopPlayback() {
      isPlaying = false;
      if (playTimeout) clearTimeout(playTimeout);
      const playBtn = document.getElementById('playBtn');
      if (playBtn) { playBtn.classList.replace('bg-amber-600', 'bg-emerald-600'); playBtn.innerHTML = '<i class="fa-solid fa-play text-xs"></i>'; }
      document.querySelectorAll('[id^="step-head-"]').forEach(el => el.classList.remove('bg-amber-400', 'text-amber-950'));
    }

    function playStep16th(step16th) {
      const beatIndex = Math.floor(step16th / 4);
      const currentSubStep = beatIndex + (step16th % 4) * 0.25;

      document.querySelectorAll('[id^="step-head-"]').forEach((el, idx) => {
        if (idx === beatIndex) el.classList.add('bg-amber-400', 'text-amber-950');
        else el.classList.remove('bg-amber-400', 'text-amber-950');
      });

      getActiveNoteList().forEach((n) => {
        const rowKey = n.name;
        if (gridData[rowKey] && gridData[rowKey][currentSubStep]) {
          playNote(rowKey, (gridData[rowKey][currentSubStep].duration || 1) * (60 / bpm));
        }
      });

      percTracks.forEach((pTrack) => {
        const rowKey = `perc_${pTrack.id}`;
        if (gridData[rowKey]) {
          Object.keys(gridData[rowKey]).forEach((key) => {
            if (Math.abs(parseFloat(key) - currentSubStep) < 0.01 && gridData[rowKey][key]) playPercussion(pTrack.id);
          });
        }
      });
    }

    function loadSampleSong(key) {

    async function exportToWav() {
      showToast('WAV 오디오 파일을 생성 중입니다...');
      const secondsPerBeat = 60 / bpm;
      const totalBeats = getTotalSteps();
      const totalDuration = totalBeats * secondsPerBeat + 1.5;
      const sampleRate = 44100;
      
      const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(sampleRate * totalDuration), sampleRate);

      const activeNotes = getActiveNoteList();
      activeNotes.forEach((n) => {
        const rowKey = n.name;
        if (gridData[rowKey]) {
          Object.keys(gridData[rowKey]).forEach((subStepStr) => {
            const subStep = parseFloat(subStepStr);
            const startTime = subStep * secondsPerBeat;
            const durBeats = gridData[rowKey][subStepStr].duration || 1;
            playNote(rowKey, durBeats * secondsPerBeat, offlineCtx, startTime);
          });
        }
      });

      percTracks.forEach((pTrack) => {
        const rowKey = `perc_${pTrack.id}`;
        if (gridData[rowKey]) {
          Object.keys(gridData[rowKey]).forEach((subStepStr) => {
            const subStep = parseFloat(subStepStr);
            const startTime = subStep * secondsPerBeat;
            playPercussion(pTrack.id, offlineCtx, startTime);
          });
        }
      });

      try {
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GarakOn_Music_${Date.now()}.wav`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('WAV 오디오 다운로드가 완료되었습니다!');
      } catch (err) {
        showToast('WAV 생성에 실패했습니다.');
      }
    }

    function bufferToWave(abuffer, len) {
      let numOfChan = abuffer.numberOfChannels,
          length = len * numOfChan * 2 + 44,
          buffer = new ArrayBuffer(length),
          view = new DataView(buffer),
          channels = [], i, sample, offset = 0, pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16);
      setUint32(0x61746164); setUint32(length - pos - 4);

      for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

      while (pos < length) {
        for (i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    /* 과거 잘 작동했던 표준 원본 구조 기반 MIDI 생성 함수 */
    function exportToMidi() {
      const ticksPerBeat = 480;
      let events = [];

      Object.keys(gridData).forEach((rowKey) => {
        if (rowKey.startsWith('perc_')) return;
        const midiPitch = midiPitchMap[rowKey];
        if (!midiPitch) return;

        Object.keys(gridData[rowKey]).forEach((stepStr) => {
          const step = parseFloat(stepStr);
          const dur = gridData[rowKey][stepStr].duration || 1;
          const startTicks = Math.round(step * ticksPerBeat);
          const endTicks = Math.round((step + dur) * ticksPerBeat);

          events.push({ ticks: startTicks, type: 0x90, pitch: midiPitch, vel: 100, isOff: 0 });
          events.push({ ticks: endTicks, type: 0x80, pitch: midiPitch, vel: 0, isOff: 1 });
        });
      });

      events.sort((a, b) => {
        if (a.ticks !== b.ticks) return a.ticks - b.ticks;
        return a.isOff - b.isOff;
      });

      function writeVLQ(num) {
        let buffer = num & 0x7F;
        let bytes = [];
        while (num >>= 7) {
          buffer <<= 8;
          buffer |= ((num & 0x7F) | 0x80);
        }
        while (true) {
          bytes.push(buffer & 0xFF);
          if (buffer & 0x80) buffer >>= 8;
          else break;
        }
        return bytes;
      }

      let trackBytes = [];
      let lastTicks = 0;

      // Tempo Event Set (120 BPM 기준 마이크로초 변환)
      const mpqn = Math.round(60000000 / bpm);
      trackBytes.push(0x00, 0xFF, 0x51, 0x03, (mpqn >> 16) & 0xFF, (mpqn >> 8) & 0xFF, mpqn & 0xFF);

      events.forEach(evt => {
        const delta = evt.ticks - lastTicks;
        lastTicks = evt.ticks;
        trackBytes.push(...writeVLQ(delta));
        trackBytes.push(evt.type, evt.pitch, evt.vel);
      });

      // End of Track Meta Event
      trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

      // MThd Header
      const header = [
        0x4D, 0x54, 0x68, 0x64, // 'MThd'
        0x00, 0x00, 0x00, 0x06, // Length: 6
        0x00, 0x00,             // Format 0
        0x00, 0x01,             // Tracks: 1
        (ticksPerBeat >> 8) & 0xFF, ticksPerBeat & 0xFF
      ];

      // MTrk Header
      const len = trackBytes.length;
      const trackHeader = [
        0x4D, 0x54, 0x72, 0x6B, // 'MTrk'
        (len >> 24) & 0xFF,
        (len >> 16) & 0xFF,
        (len >> 8) & 0xFF,
        len & 0xFF
      ];

      const fullFile = new Uint8Array([...header, ...trackHeader, ...trackBytes]);
      const blob = new Blob([fullFile], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `garakon_${Date.now()}.mid`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('MIDI 파일이 정상 생성되었습니다!');
    }

      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });

    function safeAddListener(id, event, handler) {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('resize', updateScrollSpacer);

      // 음길이 버튼 바인딩 (PC & 모바일 공통)
      document.querySelectorAll('.durationPickerContainer').forEach(container => {
        container.querySelectorAll('.dur-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const dur = parseFloat(btn.dataset.dur);
            selectedDuration = dur;
            
            document.querySelectorAll('.dur-btn').forEach(b => {
              const bDur = parseFloat(b.dataset.dur);
              if (bDur === dur) {
                b.classList.add('active-dur', 'bg-emerald-600', 'text-white', 'shadow-2xs');
                b.classList.remove('text-slate-600');
              } else {
                b.classList.remove('active-dur', 'bg-emerald-600', 'text-white', 'shadow-2xs');
                b.classList.add('text-slate-600');
              }
            });
          });
        });
      });

      window.addEventListener('keydown', (e) => {
        const activeElem = document.activeElement;
        if (activeElem && (activeElem.tagName === 'INPUT' || activeElem.tagName === 'SELECT' || activeElem.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); if (isPlaying) stopPlayback(); else startPlayback(); }
        else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
        else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      });

      safeAddListener('playBtn', 'click', () => { if (isPlaying) stopPlayback(); else startPlayback(); });
      safeAddListener('stopBtn', 'click', stopPlayback);
      safeAddListener('undoBtn', 'click', undo);
      safeAddListener('redoBtn', 'click', redo);

      safeAddListener('loopToggleBtn', 'click', () => {
        isLooping = !isLooping;
        const loopBtn = document.getElementById('loopToggleBtn');
        const loopIcon = document.getElementById('loopIcon');
        if (isLooping) {
          loopBtn.classList.replace('bg-slate-100', 'bg-emerald-100');
          loopBtn.classList.replace('text-slate-700', 'text-emerald-800');
          if (loopIcon) loopIcon.classList.replace('text-slate-500', 'text-emerald-700');
          showToast('연속 반복 재생 모드로 설정되었습니다.');
        } else {
          loopBtn.classList.replace('bg-emerald-100', 'bg-slate-100');
          loopBtn.classList.replace('text-emerald-800', 'text-slate-700');
          if (loopIcon) loopIcon.classList.replace('text-emerald-700', 'text-slate-500');
          showToast('1회 재생 모드로 설정되었습니다.');
        }
      });

      safeAddListener('clearBtn', 'click', () => { saveStateForUndo(); gridData = {}; renderGrid(); showToast('악보가 깨끗이 지워졌습니다.'); });

      // 동기화 이벤트 바인딩
      document.querySelectorAll('.instSelect').forEach(el => el.addEventListener('change', (e) => { currentInstrument = e.target.value; syncSelectControls('.instSelect', currentInstrument); updateUrlHash(); }));
      document.querySelectorAll('.scaleSelect').forEach(el => el.addEventListener('change', (e) => { currentScale = e.target.value; syncSelectControls('.scaleSelect', currentScale); renderGrid(); }));
      document.querySelectorAll('.octaveSelect').forEach(el => el.addEventListener('change', (e) => { currentOctaves = parseInt(e.target.value); syncSelectControls('.octaveSelect', currentOctaves); renderGrid(); }));
      document.querySelectorAll('.timeSigSelect').forEach(el => el.addEventListener('change', (e) => { currentTimeSig = e.target.value; syncSelectControls('.timeSigSelect', currentTimeSig); renderGrid(); }));
      document.querySelectorAll('.measuresSelect').forEach(el => el.addEventListener('change', (e) => { currentMeasures = parseInt(e.target.value); syncSelectControls('.measuresSelect', currentMeasures); renderGrid(); }));
      document.querySelectorAll('.bpmRange').forEach(el => el.addEventListener('input', (e) => { 
        bpm = parseInt(e.target.value); 
        document.querySelectorAll('.bpmRange').forEach(b => b.value = bpm);
        document.querySelectorAll('.bpmVal').forEach(v => v.innerText = bpm); 
        updateUrlHash(); 
        if (isPlaying) { stopPlayback(); startPlayback(); } 
      }));

      // 모바일 헤더 슬라이더 버튼 토글 (상단 바 접기/펴기)
      const mobileSettingsBar = document.getElementById('mobileSettingsBar');
      safeAddListener('mobileSettingsToggleBtn', 'click', () => { 
        if (mobileSettingsBar) mobileSettingsBar.classList.toggle('hidden'); 
      });

      const sampleBtn = document.getElementById('sampleBtn');
      const sampleMenu = document.getElementById('sampleMenu');
      if (sampleBtn && sampleMenu) {
        sampleBtn.addEventListener('click', (e) => { e.stopPropagation(); sampleMenu.classList.toggle('hidden'); });
        sampleMenu.addEventListener('click', (e) => { const btn = e.target.closest('[data-song]'); if (btn) { loadSampleSong(btn.dataset.song); sampleMenu.classList.add('hidden'); } });
      }

      const exportBtn = document.getElementById('exportBtn');
      const exportMenu = document.getElementById('exportMenu');
      if (exportBtn && exportMenu) {
        exportBtn.addEventListener('click', (e) => { e.stopPropagation(); exportMenu.classList.toggle('hidden'); });
      }

      safeAddListener('exportWav', 'click', exportToWav);
      safeAddListener('exportMidi', 'click', exportToMidi);
      safeAddListener('saveJson', 'click', saveProjectJson);
      safeAddListener('shareUrl', 'click', shareProjectUrl);

      const jsonInput = document.getElementById('jsonInput');
      safeAddListener('loadJson', 'click', () => { if (jsonInput) jsonInput.click(); });
      if (jsonInput) {
        jsonInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const loaded = JSON.parse(evt.target.result);
              if (loaded && loaded.gridData) {
                saveStateForUndo();
                gridData = loaded.gridData;
                if (loaded.timeSig) currentTimeSig = loaded.timeSig;
                if (loaded.measures) currentMeasures = loaded.measures;
                if (loaded.bpm) bpm = loaded.bpm;
                if (loaded.scale) currentScale = loaded.scale;
                if (loaded.octaves) currentOctaves = loaded.octaves;
                if (loaded.inst) currentInstrument = loaded.inst;

                syncSelectControls('.timeSigSelect', currentTimeSig);
                syncSelectControls('.measuresSelect', currentMeasures);
                syncSelectControls('.scaleSelect', currentScale);
                syncSelectControls('.octaveSelect', currentOctaves);
                syncSelectControls('.instSelect', currentInstrument);
                document.querySelectorAll('.bpmRange').forEach(el => el.value = bpm);
                document.querySelectorAll('.bpmVal').forEach(el => el.innerText = bpm);

                renderGrid();
                showToast('프로젝트 파일을 성공적으로 불러왔습니다.');
              }
            } catch (err) {
              showToast('유효하지 않은 프로젝트 파일입니다.');
            }
          };
          reader.readAsText(file);
        });
      }

      document.addEventListener('click', () => {
        if (sampleMenu) sampleMenu.classList.add('hidden');
        if (exportMenu) exportMenu.classList.add('hidden');
      });

      const sheetMusicModal = document.getElementById('sheetMusicModal');
      safeAddListener('sheetMusicBtn', 'click', () => { if (sheetMusicModal) { sheetMusicModal.classList.remove('hidden'); renderSheetMusic(); } });
      safeAddListener('closeSheetBtn', 'click', () => { if (sheetMusicModal) sheetMusicModal.classList.add('hidden'); });
      safeAddListener('printSheetBtn', 'click', () => { window.print(); });

      loadStateFromUrl();
      renderGrid();
    });
  </script>
</body>
</html>
