    /* URL Hash 실시간 동기화 및 음악 공유 인코딩/디코딩 지원 함수 */
    function updateUrlHash() {
      try {
        const stateObj = {
          timeSig: currentTimeSig,
          measures: currentMeasures,
          bpm: bpm,
          scale: currentScale,
          octaves: currentOctaves,
          inst: currentInstrument,
          gridData: gridData
        };
        const jsonStr = JSON.stringify(stateObj);
        const encodedData = encodeURIComponent(jsonStr);
        
        const currentPath = window.location.origin + window.location.pathname;
        window.history.replaceState(null, '', currentPath + '#data=' + encodedData);
      } catch (e) {
        console.warn("URL Hash update failed:", e);
      }
    }

    function loadStateFromUrl() {
      if (!window.location.hash || !window.location.hash.startsWith('#data=')) return false;
      try {
        const encodedData = window.location.hash.substring(6);
        const jsonStr = decodeURIComponent(encodedData);
        const loaded = JSON.parse(jsonStr);
        if (loaded && loaded.gridData) {
          gridData = loaded.gridData;
          if (loaded.timeSig) currentTimeSig = loaded.timeSig;
          if (loaded.measures) currentMeasures = loaded.measures;
          if (loaded.bpm) bpm = loaded.bpm;
          if (loaded.scale) currentScale = loaded.scale;
          if (loaded.octaves) currentOctaves = loaded.octaves;
          if (loaded.inst) currentInstrument = loaded.inst;

          const timeSigSelect = document.getElementById('timeSigSelect');
          const measuresSelect = document.getElementById('measuresSelect');
          const scaleSelect = document.getElementById('scaleSelect');
          const octaveSelect = document.getElementById('octaveSelect');
          const instSelect = document.getElementById('instSelect');
          const bpmRange = document.getElementById('bpmRange');
          const bpmVal = document.getElementById('bpmVal');

          if (timeSigSelect) timeSigSelect.value = currentTimeSig;
          if (measuresSelect) measuresSelect.value = currentMeasures;
          if (scaleSelect) scaleSelect.value = currentScale;
          if (octaveSelect) octaveSelect.value = currentOctaves;
          if (instSelect) instSelect.value = currentInstrument;
          if (bpmRange) bpmRange.value = bpm;
          if (bpmVal) bpmVal.innerText = bpm;

          return true;
        }
      } catch (e) {
        console.warn("Failed to parse URL music data:", e);
      }
      return false;
    }

    function playNote(pitch, duration = 0.5, customCtx = null, startTime = 0) {
      const ctx = customCtx || getAudioContext();
      const freq = pitchFrequencies[pitch];
      if (!freq) return;
      const now = customCtx ? startTime : ctx.currentTime;

      if (currentInstrument === 'piano') {
        const oscFund = ctx.createOscillator();   
        const oscTri = ctx.createOscillator();    
        const oscHammer = ctx.createOscillator(); 

        const gainFund = ctx.createGain();
        const gainTri = ctx.createGain();
        const gainHammer = ctx.createGain();

        oscFund.type = 'sine';
        oscFund.frequency.setValueAtTime(freq, now);

        oscTri.type = 'triangle';
        oscTri.frequency.setValueAtTime(freq * 2, now);

        oscHammer.type = 'square';
        oscHammer.frequency.setValueAtTime(freq * 4, now);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 3.5, now);
        filter.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 1.5), now + duration * 1.5);

        gainFund.gain.setValueAtTime(0.7, now);
        gainFund.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(1.2, duration * 2.0));

        gainTri.gain.setValueAtTime(0.25, now);
        gainTri.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.8, duration * 1.5));

        gainHammer.gain.setValueAtTime(0.12, now);
        gainHammer.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

        oscFund.connect(gainFund);
        oscTri.connect(gainTri);
        oscHammer.connect(gainHammer);

        gainFund.connect(filter);
        gainTri.connect(filter);
        gainHammer.connect(filter);

        filter.connect(ctx.destination);

        oscFund.start(now);
        oscTri.start(now);
        oscHammer.start(now);

        oscFund.stop(now + Math.max(1.2, duration * 2.0));
        oscTri.stop(now + Math.max(0.8, duration * 1.5));
        oscHammer.stop(now + 0.04);
        return;
      } 
      
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (currentInstrument === 'strings') {
        const numOscs = 4;
        const detunes = [-7, -2.5, 3, 7.5]; 
        const masterGain = ctx.createGain();

        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.setValueAtTime(5.5, now); 
        lfoGain.gain.setValueAtTime(freq * 0.012, now); 

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 2.2, now);
        filter.frequency.linearRampToValueAtTime(freq * 3.2, now + 0.25); 
        filter.Q.setValueAtTime(1.2, now);

        for (let i = 0; i < numOscs; i++) {
          const oscEns = ctx.createOscillator();
          oscEns.type = (i % 2 === 0) ? 'sawtooth' : 'triangle'; 
          oscEns.frequency.setValueAtTime(freq, now);
          oscEns.detune.setValueAtTime(detunes[i], now);

          lfo.connect(oscEns.frequency);
          oscEns.connect(filter);
          oscEns.start(now);
          oscEns.stop(now + duration * 1.6);
        }

        lfo.start(now);
        lfo.stop(now + duration * 1.6);

        masterGain.gain.setValueAtTime(0.001, now);
        masterGain.gain.linearRampToValueAtTime(0.28, now + 0.12);
        masterGain.gain.setValueAtTime(0.28, now + duration * 0.8);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 1.6);

        filter.connect(masterGain);
        masterGain.connect(ctx.destination);
        return;
      } else if (currentInstrument === 'woodwind') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      } else if (currentInstrument === 'marimba') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      } else if (currentInstrument === 'kalimba') {
        const oscMain = ctx.createOscillator();
        const oscHighBell = ctx.createOscillator();
        const gainMain = ctx.createGain();
        const gainHighBell = ctx.createGain();

        oscMain.type = 'sine';
        oscMain.frequency.setValueAtTime(freq, now);

        oscHighBell.type = 'sine';
        oscHighBell.frequency.setValueAtTime(freq * 4.0, now);

        gainMain.gain.setValueAtTime(0.5, now);
        gainMain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(1.2, duration * 2.2));

        gainHighBell.gain.setValueAtTime(0.35, now);
        gainHighBell.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

        oscMain.connect(gainMain);
        oscHighBell.connect(gainHighBell);
        gainMain.connect(ctx.destination);
        gainHighBell.connect(ctx.destination);

        oscMain.start(now);
        oscHighBell.start(now);
        oscMain.stop(now + Math.max(1.2, duration * 2.2));
        oscHighBell.stop(now + 0.4);
        return;
      } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration * 1.5);
    }

    function playPercussion(type, customCtx = null, startTime = 0) {
      const ctx = customCtx || getAudioContext();
      const now = customCtx ? startTime : ctx.currentTime;
      const trackObj = percTracks.find(p => p.id === type);
      const instrument = trackObj ? trackObj.selected : '';

      if (type === 'high') {
        if (instrument === '꽹과리') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const osc3 = ctx.createOscillator();

          osc1.type = 'sawtooth';
          osc2.type = 'square';
          osc3.type = 'sine';

          osc1.frequency.setValueAtTime(2450, now);
          osc2.frequency.setValueAtTime(3820, now);
          osc3.frequency.setValueAtTime(5120, now);

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(2200, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

          osc1.connect(filter);
          osc2.connect(filter);
          osc3.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now); osc2.start(now); osc3.start(now);
          osc1.stop(now + 0.35); osc2.stop(now + 0.35); osc3.stop(now + 0.35);
        } else if (instrument === '소고') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(850, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } else if (instrument === '트라이앵글') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(4100, now);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.6);
        } else if (instrument === '하이햇 (Closed)') {
          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(7000, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          noise.start(now); noise.stop(now + 0.05);
        } else if (instrument === '하이햇 (Open)') {
          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(6000, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          noise.start(now); noise.stop(now + 0.25);
        } else {
          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1200, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.8, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
          noise.start(now); noise.stop(now + 0.12);
        }

      } else if (type === 'mid') {
        if (instrument === '장구') {
          const osc = ctx.createOscillator();
          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(450, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.6, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          const toneGain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
          toneGain.gain.setValueAtTime(0.8, now);
          toneGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
          osc.connect(toneGain); toneGain.connect(ctx.destination);
          noise.start(now); noise.stop(now + 0.15);
          osc.start(now); osc.stop(now + 0.18);
        } else if (instrument === '징') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(180, now);
          osc2.frequency.setValueAtTime(184, now);

          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

          osc1.connect(gain); osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now); osc2.start(now);
          osc1.stop(now + 1.2); osc2.stop(now + 1.2);
        } else if (instrument === '우드블럭') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.05);
        } else if (instrument === '스네어 드럼') {
          const osc = ctx.createOscillator();
          const oscGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
          oscGain.gain.setValueAtTime(0.7, now);
          oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

          const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1000, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.7, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          osc.connect(oscGain); oscGain.connect(ctx.destination);
          noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
          noise.start(now); noise.stop(now + 0.2);
        } else if (instrument === '탐탐') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.25);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.05);
        }

      } else if (type === 'low') {
        if (instrument === '북') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.22);
          gain.gain.setValueAtTime(0.95, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.22);
        } else if (instrument === '용고/대고') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.4);
          gain.gain.setValueAtTime(1.0, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.4);
        } else if (instrument === '젬베') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.2);
        } else if (instrument === '킥 드럼 (베이스)') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
          gain.gain.setValueAtTime(1.0, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        } else if (instrument === '로우 탐') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(90, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.35);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.25);
          gain.gain.setValueAtTime(0.9, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.25);
        }
      }
    }

    function updateScrollSpacer() {
      const scrollArea = document.getElementById('gridScrollArea');
      const spacer = document.getElementById('headerScrollSpacer');
      if (scrollArea && spacer) {
        const scrollbarWidth = scrollArea.offsetWidth - scrollArea.clientWidth;
        spacer.style.width = `${scrollbarWidth}px`;
      }
    }

    function renderGrid() {
      const stepsHeader = document.getElementById('stepsHeader');
      const scoreGrid = document.getElementById('scoreGrid');
      const percGrid = document.getElementById('percGrid');

      if (!stepsHeader || !scoreGrid || !percGrid) return;

      stepsHeader.innerHTML = '';
      scoreGrid.innerHTML = '';
      percGrid.innerHTML = '';

      const totalQuarterBeats = getTotalSteps();
      const beatsPerMeasure = getBeatsPerMeasure();

      for (let s = 0; s < totalQuarterBeats; s++) {
        const stepBox = document.createElement('div');
        const isMeasureStart = s % beatsPerMeasure === 0;

        let borderClass = 'border-r border-slate-200';
        if (isMeasureStart) borderClass = 'border-l-2 border-l-slate-300 border-r border-slate-200';

        stepBox.className = `flex-1 h-9 sm:h-10 flex items-center justify-center text-xs font-bold ${borderClass} ${
          isMeasureStart ? 'bg-slate-200 text-slate-800 font-black' : 'bg-slate-100 text-slate-500'
        }`;
        stepBox.innerText = isMeasureStart ? `${Math.floor(s / beatsPerMeasure) + 1}마디` : '';
        stepBox.id = `step-head-${s}`;
        stepsHeader.appendChild(stepBox);
      }

      const activeNotes = getActiveNoteList();
      const rowHeightClass = getNoteRowHeightClass();

      activeNotes.forEach((n) => {
        const row = document.createElement('div');
        row.className = 'flex items-center w-full';

        const label = document.createElement('div');
        label.className = `w-16 sm:w-24 shrink-0 ${rowHeightClass} px-1.5 py-0.5 sm:px-2 sm:py-1 text-[10px] sm:text-xs font-black shadow-2xs ${n.color} flex items-center justify-between border-b border-slate-200 overflow-hidden`;
        label.innerText = n.label;
        row.appendChild(label);

        const cellsContainer = document.createElement('div');
        cellsContainer.className = 'flex flex-1 w-full relative';

        const rowKey = n.name;
        if (!gridData[rowKey]) gridData[rowKey] = {};

        for (let s = 0; s < totalQuarterBeats; s++) {
          const isMeasureStart = s % beatsPerMeasure === 0;

          let borderClass = 'border-r border-slate-200';
          if (isMeasureStart) borderClass = 'border-l-2 border-l-slate-300 border-r border-slate-200';

          const cell = document.createElement('div');
          cell.className = `grid-cell flex-1 ${rowHeightClass} border-b border-slate-200/80 relative cursor-pointer ${borderClass} ${
            isMeasureStart ? 'bg-slate-100/70 hover:bg-slate-200/50' : 'bg-white hover:bg-slate-50'
          }`;
          cell.id = `cell-${rowKey}-${s}`;

          Object.keys(gridData[rowKey]).forEach((subKey) => {
            const subStep = parseFloat(subKey);
            if (subStep >= s && subStep < s + 1) {
              const noteData = gridData[rowKey][subKey];
              const offsetInCell = subStep - s;
              const noteBlock = document.createElement('div');
              
              const leftPct = offsetInCell * 100;
              const widthPct = (noteData.duration || 1) * 100;

              noteBlock.className = `snap-note absolute top-0 h-full ${n.noteColor} shadow-sm rounded-md border border-white/60 flex items-center justify-end z-10 select-none overflow-hidden`;
              noteBlock.style.left = `${leftPct}%`;
              noteBlock.style.width = `${widthPct}%`;
              noteBlock.id = `block-${rowKey}-${subStep}`;

              const handle = document.createElement('div');
              handle.className = 'w-4 h-full cursor-ew-resize hover:bg-black/10 active:bg-black/20 flex items-center justify-center shrink-0 text-[10px] font-bold opacity-70 z-20';
              handle.innerText = '⋮';
              
              const startResize = (clientX) => {
                const totalBeats = getTotalSteps();
                let nextKeyStep = totalBeats;

                Object.keys(gridData[rowKey]).forEach(k => {
                  const kStep = parseFloat(k);
                  if (kStep > subStep && kStep < nextKeyStep) {
                    nextKeyStep = kStep;
                  }
                });

                const maxDur = nextKeyStep - subStep;

                activeResizeState = {
                  rowKey: rowKey,
                  startStep: subStep,
                  startDur: noteData.duration || 1,
                  startClientX: clientX,
                  cellWidthPx: cell.getBoundingClientRect().width,
                  totalSteps: totalBeats,
                  maxDuration: maxDur,
                  targetElem: noteBlock
                };
              };

              handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                startResize(e.clientX);
              });

              handle.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                if (e.touches.length > 0) {
                  startResize(e.touches[0].clientX);
                }
              }, { passive: false });

              noteBlock.appendChild(handle);
              cell.appendChild(noteBlock);
            }
          });

          const handleCellClick = (e) => {
            if (activeResizeState) return;
            getAudioContext();
            const rect = cell.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const fraction = Math.max(0, Math.min(0.99, clickX / rect.width));
            
            let subOffset = 0;
            if (selectedDuration === 0.25) {
              subOffset = Math.round(fraction * 4) * 0.25;
            } else if (selectedDuration === 0.5) {
              subOffset = Math.round(fraction * 2) * 0.5;
            } else {
              subOffset = 0; 
            }

            const targetStep = s + Math.min(0.75, subOffset);

            let existingKeyToToggle = null;
            Object.keys(gridData[rowKey]).forEach((existKey) => {
              const existStep = parseFloat(existKey);
              const existDur = (gridData[rowKey][existKey] && gridData[rowKey][existKey].duration) ? gridData[rowKey][existKey].duration : 1;
              if (targetStep >= existStep && targetStep < existStep + existDur - 0.001) {
                existingKeyToToggle = existKey;
              }
            });

            if (existingKeyToToggle !== null) {
              delete gridData[rowKey][existingKeyToToggle];
            } else {
              const newStart = targetStep;
              const newEnd = targetStep + selectedDuration;

              Object.keys(gridData[rowKey]).forEach((existKey) => {
                const existStep = parseFloat(existKey);
                const existDur = (gridData[rowKey][existKey] && gridData[rowKey][existKey].duration) ? gridData[rowKey][existKey].duration : 1;
                const existEnd = existStep + existDur;

                if (Math.max(newStart, existStep) < Math.min(newEnd, existEnd) - 0.001) {
                  delete gridData[rowKey][existKey];
                }
              });

              gridData[rowKey][targetStep] = { duration: selectedDuration };
              playNote(rowKey, selectedDuration * (60 / bpm));
            }
            renderGrid();
          };

          cell.addEventListener('click', handleCellClick);

          cellsContainer.appendChild(cell);
        }

        row.appendChild(cellsContainer);
        scoreGrid.appendChild(row);
      });

      const totalSubBeats8th = totalQuarterBeats * 2;

      percTracks.forEach((pTrack) => {
        const row = document.createElement('div');
        row.className = 'flex items-center w-full';

        const label = document.createElement('div');
        label.className = 'w-16 sm:w-24 shrink-0 h-11 sm:h-14 bg-amber-50 border border-amber-200 border-r-0 px-1 py-1 sm:px-2 sm:py-1.5 text-slate-700 shadow-2xs text-[10px] sm:text-xs font-black flex flex-col items-start justify-center gap-0.5';
        
        const titleSpan = document.createElement('span');
        titleSpan.innerText = pTrack.label;
        label.appendChild(titleSpan);

        const select = document.createElement('select');
        select.className = 'bg-white border border-amber-300 rounded text-[9px] sm:text-[11px] font-bold text-slate-700 px-0.5 py-0.5 w-full cursor-pointer focus:outline-none';
        pTrack.soundOpts.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.innerText = opt;
          if (opt === pTrack.selected) option.selected = true;
          select.appendChild(option);
        });

        select.addEventListener('change', (e) => {
          pTrack.selected = e.target.value;
          playPercussion(pTrack.id);
          updateUrlHash();
        });

        label.appendChild(select);
        row.appendChild(label);

        const cellsContainer = document.createElement('div');
        cellsContainer.className = 'flex flex-1 w-full relative';

        const rowKey = `perc_${pTrack.id}`;
        if (!gridData[rowKey]) gridData[rowKey] = {};

        const subBeatsPerMeasure8th = beatsPerMeasure * 2;

        for (let subIdx = 0; subIdx < totalSubBeats8th; subIdx++) {
          const isMeasureStart = subIdx % subBeatsPerMeasure8th === 0;
          const posInMeasure = subIdx % 8; 
          const isOddColInMeasure = (posInMeasure % 2 === 0); 
          const targetStep = subIdx * 0.5;

          let borderClass = 'border-r border-amber-200/80';
          if (isMeasureStart) borderClass = 'border-l-2 border-l-slate-300 border-r border-amber-200';

          const cell = document.createElement('div');
          cell.className = `grid-cell flex-1 h-11 sm:h-14 border-t border-b border-amber-200/60 relative cursor-pointer ${borderClass} ${
            isOddColInMeasure ? 'bg-amber-100/60 hover:bg-amber-200/60' : 'bg-amber-50/30 hover:bg-amber-100/40'
          }`;

          if (gridData[rowKey][targetStep]) {
            const percBlock = document.createElement('div');
            
            let fontSizeClass = 'text-2xl sm:text-3xl';
            if (pTrack.id === 'low') {
              fontSizeClass = 'text-[13px] sm:text-[15px]';
            }

            percBlock.className = `snap-note absolute inset-0 w-full h-full flex items-center justify-center z-10 font-black ${fontSizeClass} leading-none select-none ${pTrack.color}`;
            percBlock.innerText = pTrack.shape;
            cell.appendChild(percBlock);
          }

          const handleCellClick = () => {
            getAudioContext();
            if (gridData[rowKey][targetStep]) {
              delete gridData[rowKey][targetStep];
            } else {
              gridData[rowKey][targetStep] = { duration: 0.5 };
              playPercussion(pTrack.id);
            }
            renderGrid();
          };

          cell.addEventListener('click', handleCellClick);

          cellsContainer.appendChild(cell);
        }
        row.appendChild(cellsContainer);
        percGrid.appendChild(row);
      });

      updateUrlHash();
      setTimeout(updateScrollSpacer, 0);
    }

    /* VexFlow 기반 오선보 악보 변환 및 렌더링 함수 */
    function renderSheetMusic() {
      const container = document.getElementById('sheetContainer');
      if (!container) return;
      container.innerHTML = '';

      if (typeof Vex === 'undefined') {
        container.innerHTML = '<p class="text-rose-500 font-bold py-8">Library Error</p>';
        return;
      }

      const VF = Vex.Flow;
      const beatsPerMeasure = getBeatsPerMeasure();
      const totalMeasures = currentMeasures;

      let measureNotes = [];
      for (let m = 0; m < totalMeasures; m++) {
        measureNotes.push([]);
      }

      let melodyEvents = [];
      Object.keys(gridData).forEach(rowKey => {
        if (rowKey.startsWith('perc_')) return;
        Object.keys(gridData[rowKey]).forEach(stepStr => {
          const startStep = parseFloat(stepStr);
          const noteObj = gridData[rowKey][stepStr];
          melodyEvents.push({
            pitch: rowKey,
            startStep: startStep,
            duration: noteObj.duration || 1
          });
        });
      });

      melodyEvents.sort((a, b) => a.startStep - b.startStep);

      for (let m = 0; m < totalMeasures; m++) {
        const mStart = m * beatsPerMeasure;
        const mEnd = mStart + beatsPerMeasure;
        let currentPos = mStart;

        const mEvents = melodyEvents.filter(e => e.startStep >= mStart && e.startStep < mEnd);

        mEvents.forEach(evt => {
          if (evt.startStep > currentPos) {
            const restDur = evt.startStep - currentPos;
            addVexRest(measureNotes[m], restDur, VF);
            currentPos = evt.startStep;
          }

          addVexNote(measureNotes[m], evt.pitch, evt.duration, VF);
          currentPos = evt.startStep + evt.duration;
        });

        if (currentPos < mEnd) {
          const restDur = mEnd - currentPos;
          addVexRest(measureNotes[m], restDur, VF);
        }
      }

      const measuresPerLine = 2;
      const numLines = Math.ceil(totalMeasures / measuresPerLine);

      for (let line = 0; line < numLines; line++) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'w-full flex justify-center border-b border-slate-100 pb-2 overflow-x-auto';
        container.appendChild(lineDiv);

        const renderer = new VF.Renderer(lineDiv, VF.Renderer.Backends.SVG);
        renderer.resize(750, 130);
        const context = renderer.getContext();

        for (let i = 0; i < measuresPerLine; i++) {
          const mIdx = line * measuresPerLine + i;
          if (mIdx >= totalMeasures) break;

          const isFirstInLine = (i === 0);
          const isFirstMeasureOfSong = (mIdx === 0);
          const isLastMeasureOfSong = (mIdx === totalMeasures - 1);

          const width = isFirstInLine ? 380 : 350;
          const x = isFirstInLine ? 10 : 380;

          const stave = new VF.Stave(x, 10, width);

          if (isFirstInLine) {
            stave.addClef('treble');
            if (isFirstMeasureOfSong) {
              stave.addTimeSignature(currentTimeSig);
            }
          } else {
            stave.setBegBarType(VF.Barline.type.NONE);
          }

          if (isLastMeasureOfSong) {
            stave.setEndBarType(VF.Barline.type.END);
          }

          stave.setContext(context).draw();

          const notes = measureNotes[mIdx];
          if (notes.length > 0) {
            try {
              const voice = new VF.Voice({ num_beats: beatsPerMeasure, beat_value: 4 });
              voice.setMode(VF.Voice.Mode.SOFT);
              voice.addTickables(notes);

              new VF.Formatter().joinVoices([voice]).format([voice], width - (isFirstInLine ? (isFirstMeasureOfSong ? 90 : 60) : 30));
              voice.draw(context, stave);
            } catch (err) {
              console.warn("VexFlow Formatter Warning:", err);
            }
          }
        }
      }
    }

    function addVexNote(arr, pitchStr, durBeats, VF) {
      let key = pitchStr.toLowerCase().replace('#', 'b');
      let octave = parseInt(pitchStr.slice(-1));
      let noteName = pitchStr.slice(0, -1).toLowerCase();
      let vexKey = `${noteName}/${octave}`;

      let vexDur = 'q';
      let isDotted = false;

      if (durBeats === 0.25) vexDur = '16';
      else if (durBeats === 0.5) vexDur = '8';
      else if (durBeats === 1) vexDur = 'q';
      else if (durBeats === 1.5) { vexDur = 'q'; isDotted = true; }
      else if (durBeats === 2) vexDur = 'h';
      else if (durBeats === 3) { vexDur = 'h'; isDotted = true; }
      else if (durBeats === 4) vexDur = 'w';

      const pitchValueOrder = { 'c': 0, 'c#': 1, 'd': 2, 'd#': 3, 'e': 4, 'f': 5, 'f#': 6, 'g': 7, 'g#': 8, 'a': 9, 'a#': 10, 'b': 11 };
      const absPitchValue = octave * 12 + (pitchValueOrder[noteName] || 0);
      const b4PitchValue = 4 * 12 + 11;

      let stemDir = VF.StaveNote.STEM_UP;
      if (absPitchValue >= b4PitchValue) {
        stemDir = VF.StaveNote.STEM_DOWN;
      }

      const note = new VF.StaveNote({ 
        clef: 'treble', 
        keys: [vexKey], 
        duration: vexDur,
        stem_direction: stemDir 
      });

      if (pitchStr.includes('#')) {
        note.addModifier(new VF.Accidental('#'));
      }
      if (isDotted) {
        note.addModifier(new VF.Dot());
      }
      arr.push(note);
    }

    function addVexRest(arr, durBeats, VF) {
      let remaining = durBeats;
      while (remaining > 0) {
        let vexDur = 'q';
        let stepDur = 1;

        if (remaining >= 4) { vexDur = 'w'; stepDur = 4; }
        else if (remaining >= 2) { vexDur = 'h'; stepDur = 2; }
        else if (remaining >= 1) { vexDur = 'q'; stepDur = 1; }
        else if (remaining >= 0.5) { vexDur = '8'; stepDur = 0.5; }
        else { vexDur = '16'; stepDur = 0.25; }

        const rest = new VF.StaveNote({ clef: 'treble', keys: ['b/4'], duration: vexDur + 'r' });
        arr.push(rest);
        remaining -= stepDur;
      }
    }

    function handleGlobalMove(clientX) {
      if (!activeResizeState) return;

      const deltaX = clientX - activeResizeState.startClientX;
      const deltaBeats = deltaX / activeResizeState.cellWidthPx;

      let newDuration = activeResizeState.startDur + Math.round(deltaBeats * 4) * 0.25;
      newDuration = Math.max(0.25, Math.min(activeResizeState.maxDuration, newDuration));

      activeResizeState.currentDuration = newDuration;

      if (activeResizeState.targetElem) {
        activeResizeState.targetElem.style.width = `${newDuration * 100}%`;
      }
    }

    function handleGlobalEnd() {
      if (activeResizeState) {
        const { rowKey, startStep, currentDuration } = activeResizeState;
        if (currentDuration && gridData[rowKey] && gridData[rowKey][startStep]) {
          gridData[rowKey][startStep].duration = currentDuration;
        }
        activeResizeState = null;
        renderGrid();
      }
    }

    window.addEventListener('mousemove', (e) => handleGlobalMove(e.clientX));
    window.addEventListener('mouseup', handleGlobalEnd);

    window.addEventListener('touchmove', (e) => {
      if (activeResizeState && e.touches.length > 0) {
        handleGlobalMove(e.touches[0].clientX);
      }
    }, { passive: true });
    window.addEventListener('touchend', handleGlobalEnd);

    function startPlayback() {
      if (isPlaying) return;
      getAudioContext();
      isPlaying = true;
      currentStep = 0;

      const playBtn = document.getElementById('playBtn');
      if (playBtn) {
        playBtn.classList.replace('bg-emerald-600', 'bg-amber-600');
        playBtn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>';
      }

      playbackLoop();
    }

    function playbackLoop() {
      if (!isPlaying) return;

      const totalSteps16th = getTotalSteps() * 4;

      if (currentStep >= totalSteps16th) {
        if (isLooping) {
          currentStep = 0;
        } else {
          stopPlayback();
          return;
        }
      }

      playStep16th(currentStep);

      const quarterBeatDuration = 60 / bpm;
      const step16thDurationMs = (quarterBeatDuration / 4) * 1000;
      
      currentStep++;

      playTimeout = setTimeout(playbackLoop, step16thDurationMs);
    }

    function stopPlayback() {
      isPlaying = false;
      if (playTimeout) clearTimeout(playTimeout);

      const playBtn = document.getElementById('playBtn');
      if (playBtn) {
        playBtn.classList.replace('bg-amber-600', 'bg-emerald-600');
        playBtn.innerHTML = '<i class="fa-solid fa-play text-xs"></i>';
      }

      document.querySelectorAll('[id^="step-head-"]').forEach(el => {
        el.classList.remove('bg-amber-400', 'text-amber-950');
      });
    }

    function playStep16th(step16th) {
      const beatIndex = Math.floor(step16th / 4);
      const subOffset = (step16th % 4) * 0.25;
      const currentSubStep = beatIndex + subOffset;

      document.querySelectorAll('[id^="step-head-"]').forEach((el, idx) => {
        if (idx === beatIndex) {
          el.classList.add('bg-amber-400', 'text-amber-950');
        } else {
          el.classList.remove('bg-amber-400', 'text-amber-950');
        }
      });

      const activeNotes = getActiveNoteList();

      activeNotes.forEach((n) => {
        const rowKey = n.name;
        if (gridData[rowKey] && gridData[rowKey][currentSubStep]) {
          const noteData = gridData[rowKey][currentSubStep];
          const beatDuration = (noteData.duration || 1) * (60 / bpm);
          playNote(rowKey, beatDuration);
        }
      });

      percTracks.forEach((pTrack) => {
        const rowKey = `perc_${pTrack.id}`;
        if (gridData[rowKey]) {
          Object.keys(gridData[rowKey]).forEach((key) => {
            if (Math.abs(parseFloat(key) - currentSubStep) < 0.01 && gridData[rowKey][key]) {
              playPercussion(pTrack.id);
            }
          });
        }
      });
    }

    function loadSampleSong(key) {
      const song = sampleSongs[key];
      if (!song) return;

      gridData = JSON.parse(JSON.stringify(song.gridData || {}));
      currentTimeSig = song.timeSig;
      currentMeasures = song.measures;
      bpm = song.bpm;
      if (song.scale) currentScale = song.scale;
      if (song.octaves) currentOctaves = song.octaves;
      if (song.inst) currentInstrument = song.inst;

      const timeSigSelect = document.getElementById('timeSigSelect');
      const measuresSelect = document.getElementById('measuresSelect');
      const scaleSelect = document.getElementById('scaleSelect');
      const octaveSelect = document.getElementById('octaveSelect');
      const instSelect = document.getElementById('instSelect');
      const bpmRange = document.getElementById('bpmRange');
      const bpmVal = document.getElementById('bpmVal');

      if (timeSigSelect) timeSigSelect.value = currentTimeSig;
      if (measuresSelect) measuresSelect.value = currentMeasures;
      if (scaleSelect) scaleSelect.value = currentScale;
      if (octaveSelect) octaveSelect.value = currentOctaves;
      if (instSelect) instSelect.value = currentInstrument;
      if (bpmRange) bpmRange.value = bpm;
      if (bpmVal) bpmVal.innerText = bpm;

      renderGrid();
      showToast(`'${song.name}' 예시곡을 불러왔습니다.`);
    }

    /* OfflineAudioContext를 이용한 실제 WAV 오디오 파일 내보내기 (GitHub Pages 호환 보완) */
    async function exportToWav() {
      try {
        showToast("WAV 오디오 파일 생성 중...");
        
        // 1. HTTPS/GitHub Pages 환경 오디오 컨텍스트 강제 활성화 (보안 정책 통과)
        const mainCtx = getAudioContext();
        if (mainCtx.state === 'suspended') {
          await mainCtx.resume();
        }

        const sampleRate = 44100;
        const totalQuarterBeats = getTotalSteps();
        const quarterDuration = 60 / bpm;
        const totalDurationSec = totalQuarterBeats * quarterDuration + 1.5; 
        
        const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
          2, 
          Math.ceil(sampleRate * totalDurationSec), 
          sampleRate
        );

        const activeNotes = getActiveNoteList();

        // 2. 멜로디 노트 오프라인 스케줄링
        activeNotes.forEach((n) => {
          const rowKey = n.name;
          if (gridData[rowKey]) {
            Object.keys(gridData[rowKey]).forEach((stepStr) => {
              const startStep = parseFloat(stepStr);
              const noteData = gridData[rowKey][stepStr];
              const startTime = startStep * quarterDuration;
              const beatDuration = (noteData.duration || 1) * quarterDuration;
              playNote(rowKey, beatDuration, offlineCtx, startTime);
            });
          }
        });

        // 3. 타악기 노트 오프라인 스케줄링
        percTracks.forEach((pTrack) => {
          const rowKey = `perc_${pTrack.id}`;
          if (gridData[rowKey]) {
            Object.keys(gridData[rowKey]).forEach((stepStr) => {
              const startStep = parseFloat(stepStr);
              if (gridData[rowKey][stepStr]) {
                const startTime = startStep * quarterDuration;
                playPercussion(pTrack.id, offlineCtx, startTime);
              }
            });
          }
        });

        // 4. 오프라인 렌더링 수행 및 WAV 인코딩
        const renderedBuffer = await offlineCtx.startRendering();
        const wavBuffer = audioBufferToWav(renderedBuffer);
        const blob = new Blob([wavBuffer], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `garakon_${Date.now()}.wav`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("WAV 파일 다운로드 완료!");
      } catch (err) {
        console.error("WAV Export Error:", err);
        showToast("WAV 파일 생성 중 오류가 발생했습니다.");
      }
    }

    // AudioBuffer -> RIFF WAV 변환 헬퍼 함수
    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      
      let result;
      if (numChannels === 2) {
        const left = buffer.getChannelData(0);
        const right = buffer.getChannelData(1);
        result = interleave(left, right);
      } else {
        result = buffer.getChannelData(0);
      }

      const dataLength = result.length * 2;
      const bufferLength = 44 + dataLength;
      const arrayBuffer = new ArrayBuffer(bufferLength);
      const view = new DataView(arrayBuffer);

      /* RIFF identifier */
      writeString(view, 0, 'RIFF');
      /* RIFF chunk length */
      view.setUint32(4, 36 + dataLength, true);
      /* RIFF type */
      writeString(view, 8, 'WAVE');
      /* format chunk identifier */
      writeString(view, 12, 'fmt ');
      /* format chunk length */
      view.setUint32(16, 16, true);
      /* sample format (raw) */
      view.setUint16(20, format, true);
      /* channel count */
      view.setUint16(22, numChannels, true);
      /* sample rate */
      view.setUint32(24, sampleRate, true);
      /* byte rate (sample rate * block align) */
      view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
      /* block align (channel count * bytes per sample) */
      view.setUint16(32, numChannels * (bitDepth / 8), true);
      /* bits per sample */
      view.setUint16(34, bitDepth, true);
      /* data chunk identifier */
      writeString(view, 36, 'data');
      /* data chunk length */
      view.setUint32(40, dataLength, true);

      // Write PCM audio samples
      let offset = 44;
      for (let i = 0; i < result.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, result[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return arrayBuffer;
    }

    function interleave(inputL, inputR) {
      const length = inputL.length + inputR.length;
      const result = new Float32Array(length);
      let index = 0;
      let inputIndex = 0;

      while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    /* BandLab 호환 표준 MIDI 생성 함수 */
    function exportToMidi() {
      try {
        showToast("미디 파일 내보내는 중...");
        
        const pitchToMidi = {
          'C6': 84, 'B5': 83, 'A#5': 82, 'A5': 81, 'G#5': 80, 'G5': 79, 'F#5': 78, 'F5': 77, 'E5': 76, 'D#5': 75, 'D5': 74, 'C#5': 73, 'C5': 72,
          'B4': 71, 'A#4': 70, 'A4': 69, 'G#4': 68, 'G4': 67, 'F#4': 66, 'F4': 65, 'E4': 64, 'D#4': 63, 'D4': 62, 'C#4': 61, 'C4': 60,
          'B3': 59, 'A#3': 58, 'A3': 57, 'G#3': 56, 'G3': 55, 'F#3': 54, 'F3': 53, 'E3': 52, 'D#3': 51, 'D3': 50, 'C#3': 49, 'C3': 48,
          'B2': 47, 'A#2': 46, 'A2': 45, 'G2': 43, 'F#2': 42, 'F2': 41, 'E2': 40, 'D2': 38, 'C#2': 37, 'C2': 36
        };

        const ticksPerQuarter = 480;
        let events = [];

        // 1. 멜로디 노트를 미디 이벤트로 추출
        Object.keys(gridData).forEach(rowKey => {
          if (rowKey.startsWith('perc_')) return;
          const midiPitch = pitchToMidi[rowKey];
          if (!midiPitch) return;

          Object.keys(gridData[rowKey]).forEach(stepStr => {
            const qStep = parseFloat(stepStr);
            const durBeats = gridData[rowKey][stepStr].duration || 1;
            const startTick = Math.round(qStep * ticksPerQuarter);
            const durTicks = Math.round(durBeats * ticksPerQuarter);

            events.push({ tick: startTick, type: 0x90, pitch: midiPitch, vel: 90, channel: 0 });
            events.push({ tick: startTick + durTicks, type: 0x80, pitch: midiPitch, vel: 0, channel: 0 });
          });
        });

        // 2. 타악기 노트를 GM 표준 드럼 노트 번호로 매핑 (채널 9)
        const percMidiPitches = { 'high': 42, 'mid': 38, 'low': 36 }; 
        percTracks.forEach(pTrack => {
          const rowKey = `perc_${pTrack.id}`;
          if (gridData[rowKey]) {
            const percPitch = percMidiPitches[pTrack.id] || 38;
            Object.keys(gridData[rowKey]).forEach(stepStr => {
              if (gridData[rowKey][stepStr]) {
                const qStep = parseFloat(stepStr);
                const startTick = Math.round(qStep * ticksPerQuarter);
                events.push({ tick: startTick, type: 0x90, pitch: percPitch, vel: 100, channel: 9 });
                events.push({ tick: startTick + 120, type: 0x80, pitch: percPitch, vel: 0, channel: 9 });
              }
            });
          }
        });

        // 정렬: 동시 시각 처리 시 Note Off가 Note On보다 항상 우선 정렬되도록 검증
        events.sort((a, b) => a.tick === b.tick ? a.type - b.type : a.tick - b.tick);

        // 가변 길이 바이트(Variable Length Quantity) 인코더 (BandLab 호환성 검증 완료)
        function writeVarLen(val) {
          let buffer = [];
          let v = val;
          buffer.push(v & 0x7F);
          while ((v >>= 7) > 0) {
            buffer.push((v & 0x7F) | 0x80);
          }
          return buffer.reverse();
        }

        let trackBytes = [];
        const microsecondsPerBeat = Math.round(60000000 / bpm);

        // 템포 제어 데이터 헤더
        trackBytes.push(0x00, 0xFF, 0x51, 0x03, (microsecondsPerBeat >> 16) & 0xFF, (microsecondsPerBeat >> 8) & 0xFF, microsecondsPerBeat & 0xFF);

        let lastTick = 0;
        events.forEach(e => {
          const delta = e.tick - lastTick;
          lastTick = e.tick;
          trackBytes.push(...writeVarLen(delta));
          trackBytes.push(e.type | (e.channel & 0x0F));
          trackBytes.push(e.pitch & 0x7F);
          trackBytes.push(e.vel & 0x7F);
        });

        // Track End 트랙 종료 헤더
        trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

        // Standard MIDI Header (Format 0 Single Track)
        const header = [
          0x4D, 0x54, 0x68, 0x64, // MThd
          0x00, 0x00, 0x00, 0x06, // Header Length
          0x00, 0x00,             // Format 0
          0x00, 0x01,             // 1 Track
          (ticksPerQuarter >> 8) & 0xFF, ticksPerQuarter & 0xFF, // Division
          0x4D, 0x54, 0x72, 0x6B, // MTrk
          (trackBytes.length >> 24) & 0xFF, (trackBytes.length >> 16) & 0xFF, (trackBytes.length >> 8) & 0xFF, trackBytes.length & 0xFF
        ];

        const midiBuffer = Uint8Array.from([...header, ...trackBytes]);
        const blob = new Blob([midiBuffer], { type: 'audio/midi' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `garakon_${Date.now()}.mid`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(".mid 파일 다운로드 완료!");
      } catch (err) {
        showToast("MIDI 파일 생성 중 오류가 발생했습니다.");
      }
    }

    function saveBackupJson() {
      const exportData = {
        title: 'GarakOn_Project',
        timeSig: currentTimeSig,
        measures: currentMeasures,
        bpm: bpm,
        gridData: gridData
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'garakon_music.garakon';
      a.click();
      URL.revokeObjectURL(url);
      showToast('백업 파일(.garakon)이 저장되었습니다.');
    }

    function loadBackupJson(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (loaded.gridData) {
            gridData = loaded.gridData;
            if (loaded.timeSig) currentTimeSig = loaded.timeSig;
            if (loaded.measures) currentMeasures = loaded.measures;
            if (loaded.bpm) bpm = loaded.bpm;

            const timeSigSelect = document.getElementById('timeSigSelect');
            const measuresSelect = document.getElementById('measuresSelect');
            const bpmRange = document.getElementById('bpmRange');
            const bpmVal = document.getElementById('bpmVal');

            if (timeSigSelect) timeSigSelect.value = currentTimeSig;
            if (measuresSelect) measuresSelect.value = currentMeasures;
            if (bpmRange) bpmRange.value = bpm;
            if (bpmVal) bpmVal.innerText = bpm;

            renderGrid();
            showToast('백업 파일을 성공적으로 불러왔습니다.');
          }
        } catch (err) {
          showToast('올바른 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function shareUrlLink() {
      updateUrlHash();
      const stateObj = {
        timeSig: currentTimeSig,
        measures: currentMeasures,
        bpm: bpm,
        scale: currentScale,
        octaves: currentOctaves,
        inst: currentInstrument,
        gridData: gridData
      };
      const jsonStr = JSON.stringify(stateObj);
      const encodedData = encodeURIComponent(jsonStr);
      
      const fullShareUrl = window.location.origin + window.location.pathname + '#data=' + encodedData;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullShareUrl).then(() => {
          showToast('음악 정보가 담긴 공유 링크가 클립보드에 복사되었습니다.');
        }).catch(() => {
          fallbackCopyTextToClipboard(fullShareUrl);
        });
      } else {
        fallbackCopyTextToClipboard(fullShareUrl);
      }
    }

    function fallbackCopyTextToClipboard(text) {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = text;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast('음악 정보가 담긴 공유 링크가 클립보드에 복사되었습니다.');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;

      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function safeAddListener(id, event, handler) {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('resize', updateScrollSpacer);

      document.querySelectorAll('.dur-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.dur-btn').forEach((b) => {
            b.classList.remove('active-dur', 'bg-emerald-600', 'text-white', 'shadow-2xs');
            b.classList.add('text-slate-600');
            const subSvgContainer = b.querySelector('div svg');
            if (subSvgContainer) {
              b.querySelectorAll('svg').forEach(s => {
                s.classList.replace('text-amber-300', 'text-amber-600');
              });
            }
          });
          btn.classList.add('active-dur', 'bg-emerald-600', 'text-white', 'shadow-2xs');
          btn.classList.remove('text-slate-600');
          btn.querySelectorAll('svg').forEach(s => {
            s.classList.replace('text-amber-600', 'text-amber-300');
          });
          selectedDuration = parseFloat(btn.dataset.dur);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          const activeElem = document.activeElement;
          if (activeElem && (activeElem.tagName === 'INPUT' || activeElem.tagName === 'SELECT' || activeElem.tagName === 'TEXTAREA')) {
            return;
          }
          e.preventDefault();
          if (isPlaying) stopPlayback();
          else startPlayback();
        }
      });

      safeAddListener('playBtn', 'click', () => {
        if (isPlaying) stopPlayback();
        else startPlayback();
      });

      safeAddListener('stopBtn', 'click', stopPlayback);

      safeAddListener('loopToggleBtn', 'click', () => {
        isLooping = !isLooping;
        const loopBtn = document.getElementById('loopToggleBtn');
        const loopIcon = document.getElementById('loopIcon');

        if (isLooping) {
          loopBtn.classList.replace('bg-slate-100', 'bg-emerald-100');
          loopBtn.classList.replace('text-slate-700', 'text-emerald-800');
          loopBtn.classList.replace('border-slate-200', 'border-emerald-300');
          if (loopIcon) {
            loopIcon.classList.replace('fa-rotate-right', 'fa-repeat');
            loopIcon.classList.replace('text-slate-500', 'text-emerald-700');
          }
          showToast('연속 반복 재생 모드로 설정되었습니다.');
        } else {
          loopBtn.classList.replace('bg-emerald-100', 'bg-slate-100');
          loopBtn.classList.replace('text-emerald-800', 'text-slate-700');
          loopBtn.classList.replace('border-emerald-300', 'border-slate-200');
          if (loopIcon) {
            loopIcon.classList.replace('fa-repeat', 'fa-rotate-right');
            loopIcon.classList.replace('text-emerald-700', 'text-slate-500');
          }
          showToast('1회 재생 모드로 설정되었습니다.');
        }
      });

      safeAddListener('clearBtn', 'click', () => {
        gridData = {};
        renderGrid();
        showToast('악보가 깨끗이 지워졌습니다.');
      });

      safeAddListener('instSelect', 'change', (e) => {
        currentInstrument = e.target.value;
        updateUrlHash();
      });
      safeAddListener('scaleSelect', 'change', (e) => {
        currentScale = e.target.value;
        renderGrid();
      });
      safeAddListener('octaveSelect', 'change', (e) => {
        currentOctaves = parseInt(e.target.value);
        renderGrid();
      });
      safeAddListener('timeSigSelect', 'change', (e) => {
        currentTimeSig = e.target.value;
        renderGrid();
      });
      safeAddListener('measuresSelect', 'change', (e) => {
        currentMeasures = parseInt(e.target.value);
        renderGrid();
      });
      safeAddListener('bpmRange', 'input', (e) => {
        bpm = parseInt(e.target.value);
        const bpmVal = document.getElementById('bpmVal');
        if (bpmVal) bpmVal.innerText = bpm;
        updateUrlHash();
        if (isPlaying) {
          stopPlayback();
          startPlayback();
        }
      });

      const sampleBtn = document.getElementById('sampleBtn');
      const sampleMenu = document.getElementById('sampleMenu');
      if (sampleBtn && sampleMenu) {
        sampleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (exportMenu) exportMenu.classList.add('hidden');
          sampleMenu.classList.toggle('hidden');
        });
        sampleMenu.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-song]');
          if (btn) {
            loadSampleSong(btn.dataset.song);
            sampleMenu.classList.add('hidden');
          }
        });
      }

      const exportBtn = document.getElementById('exportBtn');
      const exportMenu = document.getElementById('exportMenu');
      if (exportBtn && exportMenu) {
        exportBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (sampleMenu) sampleMenu.classList.add('hidden');
          exportMenu.classList.toggle('hidden');
        });
      }

      document.addEventListener('click', (e) => {
        if (sampleMenu && !sampleMenu.contains(e.target) && e.target !== sampleBtn) {
          sampleMenu.classList.add('hidden');
        }
        if (exportMenu && !exportMenu.contains(e.target) && e.target !== exportBtn) {
          exportMenu.classList.add('hidden');
        }
      });

      safeAddListener('exportWav', 'click', () => { exportToWav(); if (exportMenu) exportMenu.classList.add('hidden'); });
      safeAddListener('exportMidi', 'click', () => { exportToMidi(); if (exportMenu) exportMenu.classList.add('hidden'); });
      safeAddListener('saveJson', 'click', () => { saveBackupJson(); if (exportMenu) exportMenu.classList.add('hidden'); });
      safeAddListener('loadJson', 'click', () => { 
        const jsonInput = document.getElementById('jsonInput');
        if (jsonInput) jsonInput.click(); 
        if (exportMenu) exportMenu.classList.add('hidden'); 
      });
      safeAddListener('jsonInput', 'change', loadBackupJson);
      safeAddListener('shareUrl', 'click', () => { shareUrlLink(); if (exportMenu) exportMenu.classList.add('hidden'); });

      const mobileSettingsToggleBtn = document.getElementById('mobileSettingsToggleBtn');
      const controlsToolbar = document.getElementById('controlsToolbar');
      if (mobileSettingsToggleBtn && controlsToolbar) {
        mobileSettingsToggleBtn.addEventListener('click', () => {
          controlsToolbar.classList.toggle('hidden');
        });
      }

      const sheetMusicModal = document.getElementById('sheetMusicModal');
      safeAddListener('sheetMusicBtn', 'click', () => {
        if (sheetMusicModal) {
          sheetMusicModal.classList.remove('hidden');
          renderSheetMusic();
        }
      });

      safeAddListener('closeSheetBtn', 'click', () => {
        if (sheetMusicModal) sheetMusicModal.classList.add('hidden');
      });

      safeAddListener('printSheetBtn', 'click', () => {
        window.print();
      });

      const loadedFromUrl = loadStateFromUrl();
      renderGrid();
      if (loadedFromUrl) {
        showToast('공유받은 음악 데이터를 불러왔습니다.');
      }
    });
  </script>
</body>
</html>
